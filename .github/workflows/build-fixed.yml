name: Build Dexin Mobile APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

env:
  ANDROID_PLATFORM: "android-34"
  ANDROID_BUILD_TOOLS: "34.0.0"
  ANDROID_NDK: "26.2.11394342"
  CMAKE_VERSION: "3.22.1"

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble source parts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t PARTS < <(find . -maxdepth 2 -type f -name '*.zip' -print0 | while IFS= read -r -d '' f; do b="$(basename "$f")"; if [[ "$b" =~ Part([0-9]+)(-[^/]*)?\.zip$ ]]; then printf '%d\t%s\n' "${BASH_REMATCH[1]}" "$f"; fi; done | sort -n -k1,1 | cut -f2-)
          [ "${#PARTS[@]}" -eq 3 ] || { echo "ERROR: expected 3 source parts, found ${#PARTS[@]}"; printf '%s\n' "${PARTS[@]}"; exit 1; }
          for i in 0 1 2; do n=$((i+1)); b="$(basename "${PARTS[$i]}")"; [[ "$b" =~ Part([0-9]+) ]] && [ "${BASH_REMATCH[1]}" -eq "$n" ] || { echo "ERROR: bad source part order: $b"; exit 1; }; done
          cat "${PARTS[@]}" > source.zip
          unzip -t source.zip
          rm -rf _source
          mkdir -p _source
          unzip -q source.zip -d _source

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail
          G="$(find _source -type f -name gradlew -print -quit)"
          [ -n "$G" ] || { echo 'ERROR: gradlew not found'; exit 1; }
          D="$(cd "$(dirname "$G")" && pwd)"
          echo "PROJECT_DIR=$D" >> "$GITHUB_ENV"
          sed -i 's/\r$//' "$D/gradlew"
          chmod +x "$D/gradlew"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}" "ndk;${ANDROID_NDK}" "cmake;${CMAKE_VERSION}"

      - name: Normalize RakNet source tree
        shell: bash
        run: |
          set -euo pipefail
          S="$PROJECT_DIR/app/src/main/cpp/samp"
          V="$S/vendor"
          test -d "$S" || { echo "ERROR: missing $S"; exit 1; }
          test -d "$V" || { echo "ERROR: missing $V"; exit 1; }
          mapfile -t RAK_DIRS < <(find "$V" -mindepth 1 -maxdepth 1 -type d -iname 'raknet' -print | sort)
          [ "${#RAK_DIRS[@]}" -gt 0 ] || { echo 'ERROR: no RakNet directory found'; find "$V" -maxdepth 2 -type d -print; exit 1; }
          chosen=""; best=0
          for d in "${RAK_DIRS[@]}"; do
            n="$(find "$d" -type f \( -iname '*.cpp' -o -iname '*.cc' -o -iname '*.cxx' \) | wc -l)"
            echo "RakNet candidate: $d -> $n source files"
            if [ "$n" -gt "$best" ]; then best="$n"; chosen="$d"; fi
          done
          [ -n "$chosen" ] && [ "$best" -gt 0 ] || { echo 'ERROR: no RakNet implementation files found'; exit 1; }
          tmp="$V/.raknet-final"
          rm -rf "$tmp"
          cp -a "$chosen" "$tmp"
          for d in "${RAK_DIRS[@]}"; do
            [ "$d" = "$chosen" ] || {
              while IFS= read -r -d '' h; do
                rel="${h#"$d"/}"; dst="$tmp/$rel"; mkdir -p "$(dirname "$dst")"; cp -n "$h" "$dst" || true
              done < <(find "$d" -type f \( -iname '*.h' -o -iname '*.hpp' -o -iname '*.inl' \) -print0)
            }
          done
          rm -rf "${RAK_DIRS[@]}"
          mv "$tmp" "$V/raknet"
          while IFS= read -r -d '' f; do
            case "$f" in
              *.c|*.cc|*.cpp|*.cxx|*.h|*.hh|*.hpp|*.inl|CMakeLists.txt|*.cmake)
                sed -i -e 's#vendor/RakNet/#vendor/raknet/#g' -e 's#vendor/RAKNET/#vendor/raknet/#g' -e 's#vendor/Raknet/#vendor/raknet/#g' -e 's#vendor/rakNET/#vendor/raknet/#g' "$f"
                ;;
            esac
          done < <(find "$S" -type f -print0)
          echo '--- RakNet final layout ---'
          find "$V" -mindepth 1 -maxdepth 1 -type d -iname '*raknet*' -print | sort
          echo '--- RakNet implementation count ---'
          find "$V/raknet" -type f \( -iname '*.cpp' -o -iname '*.cc' -o -iname '*.cxx' \) | wc -l

      - name: Fix Linux native include paths
        shell: bash
        run: |
          set -euo pipefail
          C="$PROJECT_DIR/app/src/main/cpp"
          S="$C/samp"
          mkdir -p "$S/gui/samp_widgets" "$S/game"
          copy_header() { local pattern="$1" target="$2" found; found="$(find "$C" -type f -iname "$pattern" -print -quit || true)"; [ -n "$found" ] || { echo "ERROR: header $pattern not found"; exit 1; }; cp -f "$found" "$target"; }
          copy_header 'playerTabList.h' "$S/gui/samp_widgets/playerTabList.h"
          copy_header 'RGBA.h' "$S/game/RGBA.h"

      - name: Verify unique native tree
        shell: bash
        run: |
          set -euo pipefail
          S="$PROJECT_DIR/app/src/main/cpp/samp"
          V="$S/vendor"
          test -d "$V/raknet"
          if find "$V" -mindepth 1 -maxdepth 1 -type d -iname 'raknet' | grep -v '/raknet$' | grep -q .; then echo 'ERROR: duplicate-case RakNet directory remains'; exit 1; fi
          bad="$(find "$V/raknet" -type f \( -iname '*.c' -o -iname '*.cc' -o -iname '*.cpp' -o -iname '*.cxx' \) -print | wc -l)"
          [ "$bad" -gt 0 ] || { echo 'ERROR: canonical RakNet tree has no source files'; exit 1; }
          echo 'OK: exactly one canonical RakNet implementation tree exists.'

      - name: Remove native build caches
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PROJECT_DIR/app/.cxx" "$PROJECT_DIR/app/build"

      - name: Prepare CI release signing
        shell: bash
        run: |
          set -euo pipefail
          cat > "$PROJECT_DIR/signing-ci.gradle" <<'GRADLE'
          allprojects {
              afterEvaluate { project ->
                  def androidExt = project.extensions.findByName("android")
                  if (androidExt != null) {
                      def releaseType = androidExt.buildTypes.findByName("release")
                      def debugConfig = androidExt.signingConfigs.findByName("debug")
                      if (releaseType != null && debugConfig != null) {
                          releaseType.signingConfig = debugConfig
                      }
                  }
              }
          }
          GRADLE
          test -s "$PROJECT_DIR/signing-ci.gradle"
          echo "CI signing override prepared"

      - name: Build Release APK
        id: gradle_build
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          : > /tmp/gradle-build.log
          ./gradlew --no-daemon --stacktrace --warning-mode all clean 2>&1 | tee -a /tmp/gradle-build.log
          s=${PIPESTATUS[0]}
          if [ "$s" -eq 0 ]; then ./gradlew --no-daemon --stacktrace --warning-mode all -I signing-ci.gradle :app:assembleRelease 2>&1 | tee -a /tmp/gradle-build.log; s=${PIPESTATUS[0]}; fi
          echo "GRADLE_EXIT=$s" >> /tmp/gradle-build.log
          exit "$s"

      - name: Show diagnostics
        if: always()
        run: |
          { echo '## Dexin Mobile build diagnostics'; echo '```text'; grep -nEi 'error:|fatal error:|FAILED:|FAILURE:|Execution failed|duplicate symbol|undefined reference|Could not find|validateSigning|signing|GRADLE_EXIT=' /tmp/gradle-build.log | tail -n 300 || true; echo '```'; echo; echo '### Last 300 lines'; echo '```text'; tail -n 300 /tmp/gradle-build.log || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DexinMobile-gradle-diagnostics
          path: /tmp/gradle-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if Gradle failed
        if: steps.gradle_build.outcome != 'success'
        run: exit 1

      - name: Copy APK
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/release" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          [ -n "$APK" ] || { echo 'ERROR: APK was not generated'; exit 1; }
          cp "$APK" DexinMobile.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DexinMobile-APK
          path: DexinMobile.apk
          if-no-files-found: error
          retention-days: 14
