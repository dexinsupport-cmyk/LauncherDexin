name: Build Dexin Mobile APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

env:
  ANDROID_PLATFORM: "android-34"
  ANDROID_BUILD_TOOLS: "34.0.0"
  ANDROID_NDK: "26.2.11394342"
  CMAKE_VERSION: "3.22.1"

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble source parts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t PARTS < <(
            find . -maxdepth 2 -type f -name '*.zip' -print0 |
            while IFS= read -r -d '' f; do
              b="$(basename "$f")"
              if [[ "$b" =~ Part([0-9]+)(-[^/]*)?\.zip$ ]]; then
                printf '%d\t%s\n' "${BASH_REMATCH[1]}" "$f"
              fi
            done | sort -n -k1,1 | cut -f2-
          )

          [ "${#PARTS[@]}" -eq 3 ] || {
            echo "ERROR: expected exactly 3 source parts, found ${#PARTS[@]}"
            printf 'Found:\n'; printf '  %s\n' "${PARTS[@]}"
            exit 1
          }

          expected=1
          for p in "${PARTS[@]}"; do
            b="$(basename "$p")"
            [[ "$b" =~ Part([0-9]+) ]] || { echo "ERROR: invalid part: $b"; exit 1; }
            [ "${BASH_REMATCH[1]}" -eq "$expected" ] || {
              echo "ERROR: expected Part${expected}, found $b"
              exit 1
            }
            expected=$((expected + 1))
          done

          echo "Assembling source parts:"
          printf '  %s\n' "${PARTS[@]}"
          cat "${PARTS[@]}" > source.zip
          unzip -t source.zip
          rm -rf _source
          mkdir -p _source
          unzip -q source.zip -d _source

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail
          G="$(find _source -type f -name gradlew -print -quit)"
          [ -n "$G" ] || { echo 'ERROR: gradlew not found'; exit 1; }
          D="$(cd "$(dirname "$G")" && pwd)"
          echo "PROJECT_DIR=$D" >> "$GITHUB_ENV"
          sed -i 's/\r$//' "$D/gradlew"
          chmod +x "$D/gradlew"
          echo "PROJECT_DIR=$D"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK}" \
            "cmake;${CMAKE_VERSION}"

      - name: Prepare native source tree
        shell: bash
        run: |
          set -euo pipefail
          C="$PROJECT_DIR/app/src/main/cpp"
          S="$C/samp"
          RAK_LOWER="$S/vendor/raknet"
          RAK_UPPER="$S/vendor/RakNet"

          test -d "$S" || { echo "ERROR: samp native directory not found: $S"; exit 1; }
          test -d "$RAK_LOWER" || {
            echo "ERROR: canonical RakNet directory not found: $RAK_LOWER"
            find "$S/vendor" -maxdepth 2 -type d -iname '*raknet*' -print || true
            exit 1
          }

          # IMPORTANT:
          # Network.h in this source includes ../vendor/RakNet/*.h, while the
          # real source tree is vendor/raknet. Do NOT create a symlink here.
          # CMake GLOB follows symlinks and would then compile every RakNet
          # .cpp file twice, producing ld.lld duplicate-symbol errors.
          # Instead create a header-only compatibility directory.
          rm -rf "$RAK_UPPER"
          mkdir -p "$RAK_UPPER"

          while IFS= read -r -d '' f; do
            rel="${f#"$RAK_LOWER"/}"
            dst="$RAK_UPPER/$rel"
            mkdir -p "$(dirname "$dst")"
            cp -f "$f" "$dst"
          done < <(
            find "$RAK_LOWER" -type f \
              \( -iname '*.h' -o -iname '*.hpp' -o -iname '*.inl' \) \
              -print0
          )

          # Absolute safety: compatibility tree must contain NO compilable source.
          find "$RAK_UPPER" -type f \
            \( -iname '*.c' -o -iname '*.cc' -o -iname '*.cpp' -o -iname '*.cxx' \) \
            -delete

          for h in RakClient.h RakPeer.h BitStream.h Export.h RakNetTypes.h DS_List.h; do
            test -f "$RAK_UPPER/$h" || {
              echo "ERROR: required compatibility header missing: $h"
              exit 1
            }
          done

          echo '--- RakNet directories ---'
          find "$S/vendor" -maxdepth 1 -type d -iname '*raknet*' -print | sort

          echo '--- Canonical RakNet source count ---'
          find "$RAK_LOWER" -type f \
            \( -iname '*.cpp' -o -iname '*.cc' -o -iname '*.cxx' \) | wc -l

          echo '--- Compatibility RakNet source count (MUST BE 0) ---'
          COMPAT_COUNT="$(find "$RAK_UPPER" -type f \
            \( -iname '*.cpp' -o -iname '*.cc' -o -iname '*.cxx' -o -iname '*.c' \) | wc -l)"
          echo "$COMPAT_COUNT"
          [ "$COMPAT_COUNT" -eq 0 ] || {
            echo 'ERROR: uppercase RakNet compatibility directory contains source files'
            find "$RAK_UPPER" -type f \
              \( -iname '*.cpp' -o -iname '*.cc' -o -iname '*.cxx' -o -iname '*.c' \)
            exit 1
          }

      - name: Fix Linux native include paths
        shell: bash
        run: |
          set -euo pipefail
          C="$PROJECT_DIR/app/src/main/cpp"
          S="$C/samp"
          mkdir -p "$S/gui/samp_widgets" "$S/game"

          copy_case_insensitive() {
            local pattern="$1" target="$2" found
            found="$(find "$C" -type f -iname "$pattern" -print -quit || true)"
            [ -n "$found" ] || {
              echo "ERROR: required header '$pattern' was not found"
              exit 1
            }
            cp -f "$found" "$target"
            echo "Using $target <- $found"
          }

          copy_case_insensitive 'playerTabList.h' "$S/gui/samp_widgets/playerTabList.h"
          copy_case_insensitive 'RGBA.h' "$S/game/RGBA.h"

      - name: Verify CMake source tree before configure
        shell: bash
        run: |
          set -euo pipefail
          S="$PROJECT_DIR/app/src/main/cpp/samp"
          U="$S/vendor/RakNet"
          L="$S/vendor/raknet"

          echo '--- Duplicate-case RakNet check ---'
          test -d "$L"
          test -d "$U"

          # No symlinks are allowed anywhere under vendor/RakNet.
          if find "$U" -type l -print -quit | grep -q .; then
            echo 'ERROR: symlink found in vendor/RakNet'
            find "$U" -type l -print
            exit 1
          fi

          # The compatibility tree is headers only.
          BAD="$(find "$U" -type f \
            \( -iname '*.c' -o -iname '*.cc' -o -iname '*.cpp' -o -iname '*.cxx' \) \
            -print)"
          [ -z "$BAD" ] || {
            echo 'ERROR: compilable files remain in vendor/RakNet:'
            printf '%s\n' "$BAD"
            exit 1
          }

          echo 'OK: vendor/RakNet is header-only.'
          echo 'OK: vendor/raknet is the only RakNet implementation tree.'

      - name: Remove native build caches
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PROJECT_DIR/app/.cxx" "$PROJECT_DIR/app/build"

      - name: Build Release APK
        id: gradle_build
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          : > /tmp/gradle-build.log
          ./gradlew --no-daemon --stacktrace --warning-mode all clean 2>&1 | tee -a /tmp/gradle-build.log
          s=${PIPESTATUS[0]}
          if [ "$s" -eq 0 ]; then
            ./gradlew --no-daemon --stacktrace --warning-mode all :app:assembleRelease 2>&1 | tee -a /tmp/gradle-build.log
            s=${PIPESTATUS[0]}
          fi
          echo "GRADLE_EXIT=$s" >> /tmp/gradle-build.log
          exit "$s"

      - name: Show Gradle diagnostics in Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Dexin Mobile — Build diagnostics'
            echo
            echo "**Build Release APK:** ${{ steps.gradle_build.outcome }}"
            echo
            echo '```text'
            grep -nEi 'error:|fatal error:|FAILED:|FAILURE:|Execution failed|What went wrong|Caused by:|Could not find|Could not resolve|undefined reference|duplicate class|duplicate symbol|GRADLE_EXIT=' /tmp/gradle-build.log | tail -n 250 || true
            echo '```'
            echo
            echo '### Last 300 lines'
            echo '```text'
            tail -n 300 /tmp/gradle-build.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DexinMobile-gradle-diagnostics
          path: /tmp/gradle-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if Gradle failed
        if: steps.gradle_build.outcome != 'success'
        run: exit 1

      - name: Copy APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/release" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          [ -n "$APK" ] || { echo 'ERROR: APK was not generated'; exit 1; }
          cp "$APK" DexinMobile.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DexinMobile-APK
          path: DexinMobile.apk
          if-no-files-found: error
          retention-days: 14
