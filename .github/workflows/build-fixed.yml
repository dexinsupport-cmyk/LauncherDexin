name: Build Dexin Mobile APK - Fixed

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Assemble source parts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t PARTS < <(find . -maxdepth 2 -type f -name '*.zip' -print0 | while IFS= read -r -d '' f; do b="$(basename "$f")"; if [[ "$b" =~ Part([0-9]+)(-[^/]*)?\.zip$ ]]; then printf '%d\t%s\n' "${BASH_REMATCH[1]}" "$f"; fi; done | sort -n -k1,1 | cut -f2-)
          [ "${#PARTS[@]}" -gt 0 ] || { echo 'No Part*.zip files'; exit 1; }
          n=1; for p in "${PARTS[@]}"; do b="$(basename "$p")"; [[ "$b" =~ Part([0-9]+) ]] && [ "${BASH_REMATCH[1]}" -eq "$n" ] || { echo "Bad part order: $b"; exit 1; }; n=$((n+1)); done
          cat "${PARTS[@]}" > source.zip
          unzip -t source.zip
          rm -rf _source && mkdir _source
          unzip -q source.zip -d _source

      - name: Locate project
        shell: bash
        run: |
          set -euo pipefail
          G="$(find _source -type f -name gradlew -print -quit)"; [ -n "$G" ] || { echo 'gradlew not found'; exit 1; }
          D="$(dirname "$G")"; echo "PROJECT_DIR=$D" >> "$GITHUB_ENV"
          sed -i 's/\r$//' "$D/gradlew"; chmod +x "$D/gradlew"

      - name: Patch storage and crash-safe startup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          root=Path(os.environ['PROJECT_DIR'])
          mf=root/'app/src/main/AndroidManifest.xml'
          s=mf.read_text(encoding='utf-8')
          if 'android.permission.MANAGE_EXTERNAL_STORAGE' not in s:
              m=re.search(r'<manifest\b[^>]*>',s,re.S)
              if not m: raise SystemExit('manifest tag missing')
              s=s[:m.end()]+'\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />'+s[m.end():]
              mf.write_text(s,encoding='utf-8')

          ma=root/'app/src/main/java/com/samp/mobile/launcher/MainActivity.java'
          s=ma.read_text(encoding='utf-8')
          for old,new in [
              ('import android.os.Bundle;','import android.os.Bundle;\nimport android.os.Environment;\nimport android.provider.Settings;\nimport android.net.Uri;'),
          ]:
              if 'import android.os.Environment;' not in s: s=s.replace(old,new,1)
          if 'import java.io.File;' not in s: s=s.replace('import androidx.fragment.app.FragmentTransaction;','import androidx.fragment.app.FragmentTransaction;\nimport java.io.File;')
          method='''\n    private void startGameSafely() {\n        if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.R && !Environment.isExternalStorageManager()) {\n            try { Intent i=new Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION); i.setData(Uri.parse("package:"+getPackageName())); startActivity(i); }\n            catch(Exception e) { startActivity(new Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION)); }\n            return;\n        }\n        File root=new File(Environment.getExternalStorageDirectory(),"DexinMobile");\n        File samp=new File(root,"SAMP"); File data=new File(root,"data");\n        File[] a=root.isDirectory()?root.listFiles():null; File[] b=samp.isDirectory()?samp.listFiles():null; File[] c=data.isDirectory()?data.listFiles():null;\n        if(a==null||a.length==0||b==null||b.length==0||c==null||c.length==0){\n            new androidx.appcompat.app.AlertDialog.Builder(this).setTitle("Game files cannot be read").setMessage("DexinMobile/SAMP/data cannot be read. Grant All files access and try again.").setPositiveButton("OK",null).show(); return;\n        }\n        startActivity(new Intent(MainActivity.this,SAMP.class)); finish();\n    }\n'''
          if 'private void startGameSafely()' not in s:
              pat=re.compile(r'playButton\.setOnClickListener\s*\(v\s*->\s*\{.*?startActivity\(new Intent\(MainActivity\.this,\s*SAMP\.class\)\);.*?finish\(\);\s*\}\);',re.S)
              if not pat.search(s): raise SystemExit('Start button handler not found')
              s=pat.sub('playButton.setOnClickListener(v -> startGameSafely());',s,count=1)
              pos=s.find('\n    private void fetchOnline()')
              if pos<0: raise SystemExit('fetchOnline insertion point not found')
              s=s[:pos]+method+s[pos:]
          ma.write_text(s,encoding='utf-8')

          va=root/'app/src/main/java/com/samp/mobile/launcher/VerifyActivity.java'
          va.write_text('''package com.samp.mobile.launcher;\n\nimport android.content.Intent;\nimport android.graphics.Color;\nimport android.net.Uri;\nimport android.os.Build;\nimport android.os.Bundle;\nimport android.os.Environment;\nimport android.provider.Settings;\nimport android.widget.Button;\nimport android.widget.TextView;\nimport androidx.appcompat.app.AppCompatActivity;\nimport com.samp.mobile.R;\nimport java.io.File;\n\npublic class VerifyActivity extends AppCompatActivity {\n private TextView statusIcon,statusTitle,statusDetails,pathText; private Button verifyButton;\n @Override protected void onCreate(Bundle b){super.onCreate(b);setContentView(R.layout.activity_verify); statusIcon=findViewById(R.id.verify_icon);statusTitle=findViewById(R.id.verify_title);statusDetails=findViewById(R.id.verify_details);pathText=findViewById(R.id.verify_path);verifyButton=findViewById(R.id.verify_button);pathText.setText("Game files: /storage/emulated/0/DexinMobile/");verifyButton.setOnClickListener(v->verify());verify();}\n private boolean access(){return Build.VERSION.SDK_INT<Build.VERSION_CODES.R||Environment.isExternalStorageManager();}\n private File root(){return new File(Environment.getExternalStorageDirectory(),"DexinMobile");}\n private void allow(){try{Intent i=new Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION);i.setData(Uri.parse("package:"+getPackageName()));startActivity(i);}catch(Exception e){startActivity(new Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION));}}\n private int count(File f){File[] a=f.listFiles();if(a==null)return 0;int n=0;for(File x:a)n+=x.isDirectory()?count(x):1;return n;}\n private void verify(){if(!access()){statusIcon.setText("!");statusIcon.setTextColor(Color.RED);statusTitle.setText("ACCESS REQUIRED");statusDetails.setText("Allow All files access.");verifyButton.setText("ALLOW ACCESS");verifyButton.setOnClickListener(v->allow());return;} statusIcon.setText("…");statusTitle.setText("READING FILES");statusDetails.setText("Scanning DexinMobile...");verifyButton.setEnabled(false);new Thread(()->{File r=root();String[] req={"anim","audio","data","fonts","models","SAMP","texdb","Text","Textures"};StringBuilder q=new StringBuilder();int bad=0,total=count(r);for(String n:req){File d=new File(r,n);int c=d.isDirectory()?count(d):0;q.append(n).append(": ").append(c).append(" files\\n");if(c==0)bad++;}if(!r.isDirectory()||total==0)runOnUiThread(()->fail("DexinMobile cannot be read or contains 0 files."));else if(bad>0)runOnUiThread(()->fail("Required folders appear empty.\\n\\n"+q+"\\nTotal: "+total));else runOnUiThread(()->ok("All required folders are readable.\\n\\n"+q+"\\nTotal: "+total));}).start();}\n private void ok(String s){statusIcon.setText("✓");statusIcon.setTextColor(Color.rgb(0,230,100));statusTitle.setText("VERIFY");statusTitle.setTextColor(Color.rgb(0,230,100));statusDetails.setText(s);verifyButton.setEnabled(true);verifyButton.setText("VERIFY AGAIN");verifyButton.setOnClickListener(v->verify());}\n private void fail(String s){statusIcon.setText("!");statusIcon.setTextColor(Color.RED);statusTitle.setText("NO VERIFY");statusTitle.setTextColor(Color.RED);statusDetails.setText(s);verifyButton.setEnabled(true);verifyButton.setText("VERIFY AGAIN");verifyButton.setOnClickListener(v->verify());}\n}\n''',encoding='utf-8')
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0' 'ndk;26.2.11394342' 'cmake;3.22.1'

      - name: Sign and build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          K="$PROJECT_DIR/ci.jks"; P='DexinCI_2026_Release_Key!'
          keytool -genkeypair -alias dexin -keyalg RSA -keysize 2048 -validity 10000 -keystore "$K" -storepass "$P" -keypass "$P" -dname 'CN=Dexin Mobile, O=Dexin Mobile, C=US' -noprompt
          BG="$PROJECT_DIR/app/build.gradle"
          sed -Ei "s|^([[:space:]]*storePassword[[:space:]]+).*$|\1'$P'|" "$BG" || true
          sed -Ei "s|^([[:space:]]*keyPassword[[:space:]]+).*$|\1'$P'|" "$BG" || true
          sed -Ei "s|^([[:space:]]*storeFile[[:space:]]+file\()[^)]*(\).*)$|\1'../ci.jks'\2|" "$BG" || true
          ./gradlew --no-daemon clean
          ./gradlew --no-daemon --stacktrace :app:assembleRelease 2>&1 | tee /tmp/gradle-build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DexinMobile-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DexinMobile-build-log
          path: /tmp/gradle-build.log
          if-no-files-found: ignore
          retention-days: 14
