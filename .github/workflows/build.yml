name: Build SA-MP Launcher APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK / NDK / CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.2.11394342" "cmake;3.22.1"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Prepare signing keystore
        shell: bash
        run: |
          if [ ! -f "./keystore_playmarket2.jks" ]; then
            keytool -genkeypair -v \
              -keystore "./keystore_playmarket2.jks" \
              -storepass 'EDrp131211aA!!pass' \
              -keypass 'EDrp131211aA!!pass' \
              -alias 'my-key-alias' \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=SA-MP Launcher, OU=CI, O=SA-MP, L=Unknown, ST=Unknown, C=US"
          fi

      - name: Build Release APK
        run: ./gradlew --no-daemon --stacktrace --warning-mode all :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SA-MP-Launcher-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
