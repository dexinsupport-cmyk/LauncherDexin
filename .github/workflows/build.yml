name: Build SA-MP Launcher

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    name: Build Dexin Mobile APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble source parts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t PARTS < <(find . -maxdepth 2 -type f -name '*.zip' -print0 | while IFS= read -r -d '' f; do
            b="$(basename "$f")"
            if [[ "$b" =~ Part([0-9]+)(-[^/]*)?\.zip$ ]]; then printf '%d\t%s\n' "${BASH_REMATCH[1]}" "$f"; fi
          done | sort -n -k1,1 | cut -f2-)
          [ "${#PARTS[@]}" -gt 0 ] || { echo 'ERROR: no source Part*.zip files found'; exit 1; }
          expected=1
          for p in "${PARTS[@]}"; do
            b="$(basename "$p")"
            [[ "$b" =~ Part([0-9]+) ]] || exit 1
            [ "${BASH_REMATCH[1]}" -eq "$expected" ] || { echo "ERROR: expected Part$expected, found ${BASH_REMATCH[1]}"; exit 1; }
            expected=$((expected+1))
          done
          cat "${PARTS[@]}" > source.zip
          unzip -t source.zip
          rm -rf _source && mkdir _source
          unzip -q source.zip -d _source

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail
          G="$(find _source -type f -name gradlew -print -quit)"
          [ -n "$G" ] || { echo 'ERROR: gradlew not found'; exit 1; }
          D="$(dirname "$G")"
          echo "PROJECT_DIR=$D" >> "$GITHUB_ENV"
          sed -i 's/\r$//' "$D/gradlew"
          chmod +x "$D/gradlew"

      - name: Patch Android storage, Verify and native game path
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          root = Path(os.environ['PROJECT_DIR'])

          # Android 11+ direct shared-storage access.
          mf = root / 'app/src/main/AndroidManifest.xml'
          if not mf.exists(): raise SystemExit(f'Missing manifest: {mf}')
          s = mf.read_text(encoding='utf-8')
          if 'android.permission.MANAGE_EXTERNAL_STORAGE' not in s:
              m = re.search(r'<manifest\b[^>]*>', s, re.S)
              if not m: raise SystemExit('Invalid AndroidManifest.xml: <manifest> not found')
              s = s[:m.end()] + '\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />' + s[m.end():]
              mf.write_text(s, encoding='utf-8')

          # MainActivity: verify that Java can actually read the game before native startup.
          ma = root / 'app/src/main/java/com/samp/mobile/launcher/MainActivity.java'
          s = ma.read_text(encoding='utf-8')
          if 'import android.os.Environment;' not in s:
              s = s.replace('import android.os.Bundle;\n', 'import android.os.Bundle;\nimport android.os.Environment;\nimport android.provider.Settings;\nimport android.net.Uri;\n')
          elif 'import android.net.Uri;' not in s:
              s = s.replace('import android.os.Bundle;\n', 'import android.os.Bundle;\nimport android.net.Uri;\n')
          if 'import java.io.File;' not in s:
              s = s.replace('import androidx.fragment.app.FragmentTransaction;\n', 'import androidx.fragment.app.FragmentTransaction;\nimport java.io.File;\n')
          method = r'''
    private void startGameSafely() {
        if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.R && !Environment.isExternalStorageManager()) {
            try {
                Intent i = new Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION);
                i.setData(Uri.parse("package:" + getPackageName()));
                startActivity(i);
            } catch (Exception e) {
                startActivity(new Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION));
            }
            return;
        }
        File game = new File(Environment.getExternalStorageDirectory(), "DexinMobile");
        File samp = new File(game, "SAMP");
        File data = new File(game, "data");
        File[] top = game.isDirectory() ? game.listFiles() : null;
        File[] sf = samp.isDirectory() ? samp.listFiles() : null;
        File[] df = data.isDirectory() ? data.listFiles() : null;
        if (top == null || top.length == 0 || sf == null || sf.length == 0 || df == null || df.length == 0) {
            new androidx.appcompat.app.AlertDialog.Builder(this)
                .setTitle("Game files cannot be read")
                .setMessage("DexinMobile exists, but the launcher cannot read its SAMP/data files. Grant All files access and try again.")
                .setPositiveButton("OK", null).show();
            return;
        }
        startActivity(new Intent(MainActivity.this, SAMP.class));
        finish();
    }
'''
          if 'private void startGameSafely()' not in s:
              pat = re.compile(r'playButton\.setOnClickListener\s*\(v\s*->\s*\{.*?startActivity\(new Intent\(MainActivity\.this,\s*SAMP\.class\)\);.*?finish\(\);\s*\}\);', re.S)
              if not pat.search(s): raise SystemExit('Could not find Start button handler in MainActivity.java')
              s = pat.sub('playButton.setOnClickListener(v -> startGameSafely());', s, count=1)
              marker = '\n    private void fetchOnline()'
              if marker not in s: raise SystemExit('Could not find MainActivity insertion point')
              s = s.replace(marker, method + marker, 1)
          ma.write_text(s, encoding='utf-8')

          # Verify is deliberately based on the REAL filesystem, not an online CDN or a stale manifest.
          va = root / 'app/src/main/java/com/samp/mobile/launcher/VerifyActivity.java'
          va.write_text(r'''package com.samp.mobile.launcher;

import android.content.Intent;
import android.graphics.Color;
import android.net.Uri;
import android.os.Build;
import android.os.Bundle;
import android.os.Environment;
import android.provider.Settings;
import android.widget.Button;
import android.widget.TextView;
import androidx.appcompat.app.AppCompatActivity;
import com.samp.mobile.R;
import java.io.File;

public class VerifyActivity extends AppCompatActivity {
    private TextView statusIcon, statusTitle, statusDetails, pathText;
    private Button verifyButton;

    @Override protected void onCreate(Bundle b) {
        super.onCreate(b);
        setContentView(R.layout.activity_verify);
        statusIcon = findViewById(R.id.verify_icon);
        statusTitle = findViewById(R.id.verify_title);
        statusDetails = findViewById(R.id.verify_details);
        pathText = findViewById(R.id.verify_path);
        verifyButton = findViewById(R.id.verify_button);
        pathText.setText("Game files: /storage/emulated/0/DexinMobile/");
        verifyButton.setOnClickListener(v -> verify());
        verify();
    }

    private boolean accessOK() {
        return Build.VERSION.SDK_INT < Build.VERSION_CODES.R || Environment.isExternalStorageManager();
    }
    private File gameRoot() { return new File(Environment.getExternalStorageDirectory(), "DexinMobile"); }

    private void requestAccess() {
        try {
            Intent i = new Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION);
            i.setData(Uri.parse("package:" + getPackageName()));
            startActivity(i);
        } catch (Exception e) {
            startActivity(new Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION));
        }
    }

    private void verify() {
        if (!accessOK()) {
            statusIcon.setText("!"); statusIcon.setTextColor(Color.rgb(255,70,80));
            statusTitle.setText("ACCESS REQUIRED"); statusTitle.setTextColor(Color.rgb(255,70,80));
            statusDetails.setText("Android has not granted DexinMobile file access.");
            verifyButton.setText("ALLOW ACCESS"); verifyButton.setOnClickListener(v -> requestAccess()); return;
        }
        statusIcon.setText("…"); statusIcon.setTextColor(Color.WHITE);
        statusTitle.setText("READING FILES"); statusTitle.setTextColor(Color.WHITE);
        statusDetails.setText("Scanning the real DexinMobile folder...");
        verifyButton.setEnabled(false);
        new Thread(() -> {
            File root = gameRoot();
            File[] top = root.isDirectory() ? root.listFiles() : null;
            if (top == null) { runOnUiThread(() -> fail("Cannot read DexinMobile. listFiles() returned null.")); return; }
            String[] required = {"anim","audio","data","fonts","models","SAMP","texdb","Text","Textures"};
            StringBuilder report = new StringBuilder();
            int empty = 0;
            for (String n : required) {
                File d = new File(root, n);
                int count = d.isDirectory() ? countFiles(d) : 0;
                report.append(n).append(": ").append(count).append(" files\n");
                if (count == 0) empty++;
            }
            int total = countFiles(root);
            if (total == 0) { runOnUiThread(() -> fail("DexinMobile is readable but contains 0 files.")); return; }
            if (empty > 0) {
                String msg = "The app can read DexinMobile, but required folders appear empty.\n\n" + report + "\nTotal files read: " + total;
                runOnUiThread(() -> fail(msg));
            } else {
                String msg = "All required folders are readable.\n\n" + report + "\nTotal files read: " + total;
                runOnUiThread(() -> success(msg));
            }
        }).start();
    }

    private int countFiles(File f) {
        File[] a = f.listFiles(); if (a == null) return 0;
        int n = 0; for (File x : a) n += x.isDirectory() ? countFiles(x) : 1; return n;
    }
    private void success(String s) {
        statusIcon.setText("✓"); statusIcon.setTextColor(Color.rgb(0,230,100));
        statusTitle.setText("VERIFY"); statusTitle.setTextColor(Color.rgb(0,230,100));
        statusDetails.setText(s); verifyButton.setEnabled(true); verifyButton.setText("VERIFY AGAIN"); verifyButton.setOnClickListener(v -> verify());
    }
    private void fail(String s) {
        statusIcon.setText("!"); statusIcon.setTextColor(Color.rgb(255,70,80));
        statusTitle.setText("NO VERIFY"); statusTitle.setTextColor(Color.rgb(255,70,80));
        statusDetails.setText(s); verifyButton.setEnabled(true); verifyButton.setText("VERIFY AGAIN"); verifyButton.setOnClickListener(v -> verify());
    }
}
''', encoding='utf-8')

          # Native: force the same absolute game root and emit it to the native log.
          p = root / 'app/src/main/cpp/samp/main.cpp'
          if p.exists():
              s = p.read_text(encoding='utf-8-sig')
              if 'g_dexinStorage' not in s.split('void ReadSettingFile',1)[0]:
                  s = s.replace('char* g_pszStorage = nullptr;', 'char* g_pszStorage = nullptr;\nchar g_dexinStorage[512] = {0};')
              needle = 'javaVM = vm;'
              if 'Dexin native storage:' not in s and needle in s:
                  s = s.replace(needle, needle + '\n    snprintf(g_dexinStorage, sizeof(g_dexinStorage), "/storage/emulated/0/DexinMobile/");\n    g_pszStorage = g_dexinStorage;\n    LOGI("Dexin native storage: %s", g_pszStorage);', 1)
              p.write_text(s, encoding='utf-8')

          p = root / 'app/src/main/cpp/samp/main.h'
          if p.exists():
              s = p.read_text(encoding='utf-8-sig')
              if 'extern char g_dexinStorage[512];' not in s and 'extern char* g_pszStorage;' in s:
                  s = s.replace('extern char* g_pszStorage;', 'extern char* g_pszStorage;\nextern char g_dexinStorage[512];')
              p.write_text(s, encoding='utf-8')

          p = root / 'app/src/main/cpp/samp/game/hooks.cpp'
          if p.exists():
              s = p.read_text(encoding='utf-8-sig')
              old = 'g_pszStorage = (char*)(g_libGTASA + (VER_x32 ? 0x6D687C : 0x8B46A8)); // StorageRootBuffer'
              if old in s:
                  s = s.replace(old, 'snprintf(g_dexinStorage, sizeof(g_dexinStorage), "/storage/emulated/0/DexinMobile/");\n    g_pszStorage = g_dexinStorage;\n    FLog("Dexin storage root: %s", g_pszStorage);')
              p.write_text(s, encoding='utf-8')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0' 'ndk;26.2.11394342' 'cmake;3.22.1'

      - name: Create CI signing keystore
        shell: bash
        run: |
          K="$PROJECT_DIR/keystore_playmarket2.jks"; P='DexinCI_2026_Release_Key!'; rm -f "$K"
          keytool -genkeypair -alias my-key-alias -keyalg RSA -keysize 2048 -validity 10000 -keystore "$K" -storepass "$P" -keypass "$P" -dname 'CN=Dexin Mobile, OU=Release, O=Dexin Mobile, L=Dexin, ST=NA, C=US' -noprompt

      - name: Fix native Linux case sensitivity
        shell: bash
        run: |
          set -euo pipefail
          C="$PROJECT_DIR/app/src/main/cpp"; [ -d "$C" ] || exit 1
          P="$(find "$C" -type f -iname 'playertablist.h' -print -quit || true)"; [ -z "$P" ] || cp -f "$P" "$(dirname "$P")/playerTabList.h"
          R="$(find "$C" -type f -iname 'RGBA.h' -print -quit || true)"; [ -z "$R" ] || cp -f "$R" "$(dirname "$R")/RGBA.h"
          V="$C/samp"; RD="$(find "$V" -maxdepth 2 -type d -iname 'raknet' -print -quit || true)"; [ -n "$RD" ] || { echo 'ERROR: RakNet directory missing'; exit 1; }
          find "$C" -type f \( -name '*.cpp' -o -name '*.c' -o -name '*.h' -o -name '*.hpp' \) -print0 | xargs -0 -r sed -i -e 's|vendor/RakNet/|vendor/raknet/|g' -e 's|"RakNet/|"raknet/|g' -e 's|\.\./vendor/RakNet/|../vendor/raknet/|g'
          for H in BitStream.h RakClientInterface.h RakClient.h; do F="$(find "$RD" -maxdepth 1 -type f -iname "$H" -print -quit || true)"; [ -n "$F" ] || { echo "ERROR: $H missing"; exit 1; }; [ "$(basename "$F")" = "$H" ] || cp -f "$F" "$RD/$H"; done

      - name: Fix release signing
        shell: bash
        run: |
          BG="$PROJECT_DIR/app/build.gradle"; PASS='DexinCI_2026_Release_Key!'
          sed -Ei "s|^([[:space:]]*storePassword[[:space:]]+).*$|\1'$PASS'|" "$BG" || true
          sed -Ei "s|^([[:space:]]*keyPassword[[:space:]]+).*$|\1'$PASS'|" "$BG" || true
          sed -Ei "s|^([[:space:]]*storeFile[[:space:]]+file\()[^)]*(\).*)$|\1'../keystore_playmarket2.jks'\2|" "$BG" || true

      - name: Patch deprecated repository
        run: find "$PROJECT_DIR" -type f -name '*.gradle' -print0 | xargs -0 -r sed -i 's/jcenter()/mavenCentral()/g'

      - name: Clean
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew --no-daemon clean

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace --warning-mode all :app:assembleRelease 2>&1 | tee /tmp/gradle-build.log

      - name: Prepare APK
        if: success()
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/release" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          [ -n "$APK" ] || exit 1
          cp "$APK" DexinMobile.apk

      - name: Upload actual APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DexinMobile-APK
          path: DexinMobile.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK release
        if: success() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dexinmobile-${{ github.run_number }}
          name: Dexin Mobile APK ${{ github.run_number }}
          files: DexinMobile.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DexinMobile-build-log
          path: /tmp/gradle-build.log
          retention-days: 14
