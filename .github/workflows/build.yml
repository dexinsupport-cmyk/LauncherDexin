name: Build SA-MP Launcher

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    name: Build Dexin Mobile APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect and assemble all source parts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t PARTS < <(find . -maxdepth 2 -type f -regextype posix-extended -regex '.*/sampstable_DexinMobile_fixedPart[0-9]+\.zip' | sort -V)
          if [ "${#PARTS[@]}" -eq 0 ]; then
            mapfile -t PARTS < <(find . -maxdepth 2 -type f -regextype posix-extended -regex '.*/sampstable_(github_ready|DexinMobile_updated)Part[0-9]+(-[^/]*)?\.zip' | sort -V)
          fi
          [ "${#PARTS[@]}" -gt 0 ] || { echo 'ERROR: no source parts found'; exit 1; }
          echo "Found ${#PARTS[@]} source parts:"
          printf '  %s\n' "${PARTS[@]}"
          expected=1
          for part in "${PARTS[@]}"; do
            base="$(basename "$part")"
            num="$(printf '%s' "$base" | sed -E 's/.*Part([0-9]+).*/\1/')"
            [ "$num" = "$expected" ] || { echo "ERROR: expected Part${expected}, found Part${num}"; exit 1; }
            expected=$((expected + 1))
          done
          rm -f source.zip
          cat "${PARTS[@]}" > source.zip
          unzip -t source.zip >/dev/null
          rm -rf _source
          mkdir _source
          unzip -q source.zip -d _source
          echo "SOURCE_PARTS=${#PARTS[@]}" >> "$GITHUB_ENV"

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail
          G="$(find _source -type f -name gradlew -print | head -n1)"
          [ -n "$G" ] || { echo 'ERROR: gradlew not found'; exit 1; }
          D="$(dirname "$G")"
          echo "PROJECT_DIR=$D" >> "$GITHUB_ENV"
          sed -i 's/\r$//' "$D/gradlew"
          find "$D" -type f \( -name '*.gradle' -o -name '*.gradle.kts' -o -name '*.sh' -o -name '*.properties' -o -name '*.cmake' -o -name 'CMakeLists.txt' \) -exec sed -i 's/\r$//' {} \;
          chmod +x "$D/gradlew"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0' 'ndk;26.2.11394342' 'cmake;3.22.1'

      - name: Create CI signing keystore
        shell: bash
        run: |
          set -euo pipefail
          K="$PROJECT_DIR/keystore_playmarket2.jks"
          P='DexinCI_2026_Release_Key!'
          rm -f "$K"
          keytool -genkeypair -alias my-key-alias -keyalg RSA -keysize 2048 -validity 10000 -keystore "$K" -storepass "$P" -keypass "$P" -dname 'CN=Dexin Mobile, OU=Release, O=Dexin Mobile, L=Dexin, ST=NA, C=US' -noprompt
          keytool -list -keystore "$K" -storepass "$P" -alias my-key-alias >/dev/null

      - name: Fix native Linux case sensitivity
        shell: bash
        run: |
          set -euo pipefail
          C="$PROJECT_DIR/app/src/main/cpp"
          P="$(find "$C" -type f -iname 'playertablist.h' -print | head -n1 || true)"; [ -z "$P" ] || cp -f "$P" "$(dirname "$P")/playerTabList.h"
          R="$(find "$C" -type f -iname 'RGBA.h' -print | head -n1 || true)"; [ -z "$R" ] || cp -f "$R" "$(dirname "$R")/RGBA.h"
          V="$C/samp/vendor"; RD="$(find "$V" -maxdepth 1 -type d -iname 'raknet' -print | head -n1 || true)"
          [ -n "$RD" ] || { echo 'ERROR: RakNet directory missing'; exit 1; }
          find "$C" -type f \( -name '*.cpp' -o -name '*.c' -o -name '*.h' -o -name '*.hpp' \) -print0 | xargs -0 -r sed -i -e 's|vendor/RakNet/|vendor/raknet/|g' -e 's|"RakNet/|"raknet/|g' -e 's|\.\./vendor/RakNet/|../vendor/raknet/|g'
          for H in BitStream.h RakClientInterface.h RakClient.h; do F="$(find "$RD" -maxdepth 1 -type f -iname "$H" -print | head -n1 || true)"; [ -n "$F" ] || { echo "ERROR: $H missing"; exit 1; }; [ "$(basename "$F")" = "$H" ] || cp -f "$F" "$RD/$H"; done

      - name: Fix release signing configuration
        shell: bash
        run: |
          set -euo pipefail
          BG="$PROJECT_DIR/app/build.gradle"
          PASS='DexinCI_2026_Release_Key!'
          K="$PROJECT_DIR/keystore_playmarket2.jks"
          test -f "$BG"; test -f "$K"
          sed -Ei "s|^([[:space:]]*storePassword[[:space:]]+).*$|\1'$PASS'|" "$BG"
          sed -Ei "s|^([[:space:]]*keyPassword[[:space:]]+).*$|\1'$PASS'|" "$BG"
          sed -Ei "s|^([[:space:]]*storeFile[[:space:]]+file\()[^)]*(\).*)$|\1'../keystore_playmarket2.jks'\2|" "$BG" || true
          keytool -list -keystore "$K" -storepass "$PASS" -alias my-key-alias >/dev/null
          grep -n -E 'storeFile|storePassword|keyPassword|keyAlias' "$BG" || true

      - name: Patch deprecated repository
        shell: bash
        run: |
          set -euo pipefail
          find "$PROJECT_DIR" -type f -name '*.gradle' -print0 | xargs -0 -r sed -i 's/jcenter()/mavenCentral()/g'

      - name: Clean
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: ./gradlew --no-daemon clean

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace --warning-mode all :app:assembleRelease 2>&1 | tee /tmp/gradle-build.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DexinMobile-build-log
          path: /tmp/gradle-build.log
          retention-days: 7

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DexinMobile-Release-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
