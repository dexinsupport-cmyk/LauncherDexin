name: Build Dexin Mobile APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble source parts
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t PARTS < <(
            find . -maxdepth 2 -type f -name '*.zip' -print0 |
            while IFS= read -r -d '' f; do
              b="$(basename "$f")"
              if [[ "$b" =~ [Pp]art([0-9]+)(-[^/]*)?\.zip$ ]]; then
                printf '%s\t%s\n' "${BASH_REMATCH[1]}" "$f"
              fi
            done |
            sort -n -k1,1 |
            cut -f2-
          )

          [ "${#PARTS[@]}" -gt 0 ] || {
            echo "ERROR: no source Part*.zip files found"
            exit 1
          }

          expected=1

          for p in "${PARTS[@]}"; do
            b="$(basename "$p")"

            [[ "$b" =~ [Pp]art([0-9]+) ]] || {
              echo "ERROR: invalid source part: $b"
              exit 1
            }

            [ "${BASH_REMATCH[1]}" -eq "$expected" ] || {
              echo "ERROR: expected Part${expected}, found $b"
              exit 1
            }

            expected=$((expected + 1))
          done

          echo "Parts found:"
          printf ' - %s\n' "${PARTS[@]}"

          cat "${PARTS[@]}" > source.zip

          unzip -t source.zip

          rm -rf _source
          mkdir -p _source

          unzip -q source.zip -d _source

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          G="$(find _source -type f -name gradlew -print -quit)"

          [ -n "$G" ] || {
            echo "ERROR: gradlew not found"
            exit 1
          }

          D="$(cd "$(dirname "$G")" && pwd)"

          echo "PROJECT_DIR=$D" >> "$GITHUB_ENV"

          sed -i 's/\r$//' "$D/gradlew"
          chmod +x "$D/gradlew"

          echo "Gradle project: $D"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.2.11394342" \
            "cmake;3.22.1"

      - name: Fix Linux native include paths
        shell: bash
        run: |
          set -euo pipefail

          C="$PROJECT_DIR/app/src/main/cpp"
          S="$C/samp"

          echo "Native source: $C"

          mkdir -p \
            "$S/gui/samp_widgets" \
            "$S/game" \
            "$S/vendor/RakNet"

          copy_case_insensitive() {
            local pattern="$1"
            local target="$2"
            local found

            found="$(find "$C" -type f -iname "$pattern" -print -quit || true)"

            [ -n "$found" ] || {
              echo "ERROR: required header '$pattern' was not found"
              exit 1
            }

            echo "Copying:"
            echo "  $found"
            echo "  -> $target"

            cp -f "$found" "$target"
          }

          copy_case_insensitive \
            "playerTabList.h" \
            "$S/gui/samp_widgets/playerTabList.h"

          copy_case_insensitive \
            "RGBA.h" \
            "$S/game/RGBA.h"

          #
          # IMPORTANT:
          #
          # Network.h uses:
          #
          #   ../vendor/RakNet/RakClient.h
          #
          # The real directory is:
          #
          #   vendor/raknet
          #
          # Linux is case-sensitive.
          #
          # We therefore mirror ONLY HEADER FILES into:
          #
          #   vendor/RakNet
          #
          # We do NOT copy .cpp files.
          #
          # This prevents duplicate-symbol errors from CMake.
          #

          REAL_RAKNET="$S/vendor/raknet"
          MIRROR_RAKNET="$S/vendor/RakNet"

          [ -d "$REAL_RAKNET" ] || {
            echo "ERROR: real RakNet directory not found:"
            echo "$REAL_RAKNET"
            exit 1
          }

          echo "Mirroring RakNet headers..."

          find "$REAL_RAKNET" -type f \
            \
              -iname "*.h" \
              -o -iname "*.hpp" \
              -o -iname "*.inl" \
            \
            -print0 |
          while IFS= read -r -d '' src; do

            rel="${src#"$REAL_RAKNET"/}"
            dst="$MIRROR_RAKNET/$rel"

            mkdir -p "$(dirname "$dst")"

            cp -f "$src" "$dst"

          done

          #
          # Verify the exact headers needed by Network.h.
          #

          test -f "$MIRROR_RAKNET/RakClient.h" || {
            echo "ERROR: RakClient.h missing"
            exit 1
          }

          test -f "$MIRROR_RAKNET/RakPeer.h" || {
            echo "ERROR: RakPeer.h missing"
            exit 1
          }

          #
          # RakPeer.h includes Export.h.
          # Search case-insensitively and make sure the Linux-visible
          # filename is exactly Export.h.
          #

          EXPORT="$(find "$REAL_RAKNET" -type f -iname "Export.h" -print -quit || true)"

          if [ -n "$EXPORT" ]; then
            cp -f "$EXPORT" "$MIRROR_RAKNET/Export.h"
          fi

          test -f "$MIRROR_RAKNET/Export.h" || {
            echo "ERROR: Export.h missing from RakNet mirror"
            echo "Searching for possible variants:"
            find "$REAL_RAKNET" -type f \
              -iname "*export*.h" -o -iname "*Export*.h" \
              -print || true
            exit 1
          }

          echo
          echo "RakNet headers available:"
          find "$MIRROR_RAKNET" -type f \
            -name "*.h" -o -name "*.hpp" -o -name "*.inl" |
            sort |
            head -n 200

          echo
          echo "Checking for accidental C++ source duplication..."

          if find "$MIRROR_RAKNET" -type f \
            -name "*.cpp" -o -name "*.cc" -o -name "*.cxx" |
            grep -q .; then

            echo "ERROR: C++ source files were copied into RakNet mirror!"
            find "$MIRROR_RAKNET" -type f \
              -name "*.cpp" -o -name "*.cc" -o -name "*.cxx"
            exit 1
          fi

          echo
          echo "Required RakNet headers:"
          ls -la \
            "$MIRROR_RAKNET/RakClient.h" \
            "$MIRROR_RAKNET/RakPeer.h" \
            "$MIRROR_RAKNET/Export.h"

      - name: Native source diagnostics
        shell: bash
        run: |
          set -euo pipefail

          C="$PROJECT_DIR/app/src/main/cpp"

          echo "Checking native include compatibility..."

          test -f "$C/samp/gui/samp_widgets/playerTabList.h"
          test -f "$C/samp/game/RGBA.h"
          test -f "$C/samp/vendor/RakNet/RakClient.h"
          test -f "$C/samp/vendor/RakNet/RakPeer.h"
          test -f "$C/samp/vendor/RakNet/Export.h"

          test ! -L "$C/samp/vendor/RakNet" || {
            echo "ERROR: vendor/RakNet must not be a symlink"
            exit 1
          }

          echo "OK: required Linux headers exist."

      - name: Build Release APK
        id: gradle_build
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail

          : > /tmp/gradle-build.log

          echo "
