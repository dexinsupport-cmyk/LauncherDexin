name: Build SA-MP Launcher

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Reassemble 3 Parts and Build APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check 3 source parts
        shell: bash
        run: |
          set -e

          test -f "sampstable_github_readyPart1.zip"
          test -f "sampstable_github_readyPart2.zip"
          test -f "sampstable_github_readyPart3.zip"

          echo "All 3 source parts found."

      - name: Reassemble original ZIP
        shell: bash
        run: |
          set -e

          cat \
            "sampstable_github_readyPart1.zip" \
            "sampstable_github_readyPart2.zip" \
            "sampstable_github_readyPart3.zip" \
            > sampstable_github_ready.zip

          echo "Testing reconstructed ZIP..."
          unzip -t sampstable_github_ready.zip

      - name: Extract complete source
        shell: bash
        run: |
          set -e

          rm -rf _source
          mkdir -p _source

          unzip -q sampstable_github_ready.zip -d _source

          echo "Source extracted."

          find _source -name "gradlew" -type f -print

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.2.11394342" \
            "cmake;3.22.1"

      - name: Prepare Gradle project
        shell: bash
        run: |
          set -e

          PROJECT=$(find _source -name "gradlew" -type f | head -1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Gradle project:"
          echo "$PROJECT_DIR"

          # Fix Windows CRLF line endings
          sed -i 's/\r$//' "$PROJECT_DIR/gradlew"

          chmod +x "$PROJECT_DIR/gradlew"

      # ==========================================================
      # LINUX CASE-SENSITIVE FIXES
      # ==========================================================

      - name: Fix Linux case-sensitive C++ headers
        shell: bash
        run: |
          set -e

          CPP_DIR="$PROJECT_DIR/app/src/main/cpp"

          echo "Searching for case-sensitive header problems..."

          find "$CPP_DIR" -type f \
            \( -name "*.h" -o -name "*.hpp" -o -name "*.cpp" -o -name "*.c" \) \
            -print | head -100

          # ------------------------------------------------------
          # playerTabList.h
          # Actual source file:
          # playertablist.h
          # ------------------------------------------------------

          FILE="$CPP_DIR/samp/gui/samp_widgets/playertablist.h"

          if [ -f "$FILE" ]; then
            cp "$FILE" \
              "$CPP_DIR/samp/gui/samp_widgets/playerTabList.h"

            echo "Fixed playerTabList.h"
          fi

          # ------------------------------------------------------
          # Also create compatibility variants where required.
          # ------------------------------------------------------

          find "$CPP_DIR" -type f \
            \( -name "*.h" -o -name "*.hpp" \) \
            -print

      - name: Verify native source
        shell: bash
        run: |
          set -e

          CPP_DIR="$PROJECT_DIR/app/src/main/cpp"

          echo "Checking required native files..."

          test -f \
            "$CPP_DIR/samp/gui/samp_widgets/playertablist.h"

          test -f \
            "$CPP_DIR/samp/gui/samp_widgets/playerTabList.h"

          echo "Native header verification successful."

      - name: Clean Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          ./gradlew --no-daemon clean

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Starting Release APK build..."

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            :app:assembleRelease

      - name: Find generated APK
        if: success()
        shell: bash
        run: |
          echo "================================"
          echo "GENERATED APK FILES"
          echo "================================"

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SA-MP-Launcher-Release
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
