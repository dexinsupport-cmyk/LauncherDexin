name: Build SA-MP Launcher

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Dexin Mobile APK
    runs-on: ubuntu-22.04

    steps:
      - name: "01 - Checkout"
        uses: actions/checkout@v4

      - name: "02 - Detect source parts"
        shell: bash
        run: |
          set -euo pipefail
          echo "=== DETECTING SOURCE PARTS ==="

          find . -maxdepth 1 -type f -name '*Part*.zip' -printf '%f %s bytes\n' | sort || true

          pick_part() {
            local n="$1"
            local f=""
            f="$(find . -maxdepth 1 -type f \( \
              -name "sampstable_github_readyPart${n}.zip" -o \
              -name "sampstable_github_readyPart${n}-*.zip" -o \
              -name "sampstable_DexinMobile_updatedPart${n}.zip" -o \
              -name "sampstable_DexinMobile_updatedPart${n}-*.zip" \
            \) -print | sort | head -n 1 || true)"
            printf '%s' "$f"
          }

          P1="$(pick_part 1)"
          P2="$(pick_part 2)"
          P3="$(pick_part 3)"

          [ -n "$P1" ] || { echo "ERROR: Part 1 not found"; exit 1; }
          [ -n "$P2" ] || { echo "ERROR: Part 2 not found"; exit 1; }
          [ -n "$P3" ] || { echo "ERROR: Part 3 not found"; exit 1; }

          P1="${P1#./}"
          P2="${P2#./}"
          P3="${P3#./}"

          echo "Part 1: $P1"
          echo "Part 2: $P2"
          echo "Part 3: $P3"

          stat -c '%n = %s bytes' "$P1" "$P2" "$P3"

          echo "P1=$P1" >> "$GITHUB_ENV"
          echo "P2=$P2" >> "$GITHUB_ENV"
          echo "P3=$P3" >> "$GITHUB_ENV"

      - name: "03 - Reassemble source ZIP"
        shell: bash
        run: |
          set -euo pipefail
          echo "=== REASSEMBLING SOURCE ==="
          rm -rf _source _repair
          mkdir -p _source _repair

          cat "$P1" "$P2" "$P3" > _repair/source.zip

          echo "Combined size:"
          stat -c '%s bytes' _repair/source.zip

          echo "Checking ZIP using unzip..."
          if unzip -t _repair/source.zip > /tmp/unzip-test.log 2>&1; then
            echo "DIRECT CONCATENATION: PASSED"
            unzip -q _repair/source.zip -d _source
          else
            echo "DIRECT CONCATENATION: FAILED"
            cat /tmp/unzip-test.log || true
            echo "Trying ZIP repair with zip -FF..."

            rm -f _repair/repaired.zip
            if zip -FF _repair/source.zip --out _repair/repaired.zip > /tmp/zip-repair.log 2>&1; then
              if unzip -t _repair/repaired.zip > /tmp/repaired-test.log 2>&1; then
                echo "ZIP REPAIR: PASSED"
                unzip -q _repair/repaired.zip -d _source
              else
                echo "ZIP REPAIR PRODUCED AN INVALID ARCHIVE"
                cat /tmp/repaired-test.log || true
                exit 1
              fi
            else
              echo "ZIP REPAIR: FAILED"
              cat /tmp/zip-repair.log || true
              echo "Trying 7z recovery..."

              if command -v 7z >/dev/null 2>&1 && 7z x -y _repair/source.zip -o_source > /tmp/7z.log 2>&1; then
                echo "7z extraction succeeded."
              else
                echo "ALL SOURCE ASSEMBLY METHODS FAILED."
                cat /tmp/7z.log || true
                echo "Part sizes:"
                stat -c '%n %s bytes' "$P1" "$P2" "$P3"
                echo "Part headers:"
                xxd -l 16 "$P1" || true
                xxd -l 16 "$P2" || true
                xxd -l 16 "$P3" || true
                exit 1
              fi
            fi
          fi

          echo "=== SOURCE ASSEMBLY COMPLETE ==="
          find _source -maxdepth 4 -type f -name gradlew -print || true

      - name: "04 - Locate Gradle project"
        shell: bash
        run: |
          set -euo pipefail
          GRADLEW="$(find _source -type f -name gradlew -print | head -n 1 || true)"
          [ -n "$GRADLEW" ] || { echo "ERROR: gradlew not found after source extraction"; exit 1; }
          PROJECT_DIR="$(dirname "$GRADLEW")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Gradle project: $PROJECT_DIR"

      - name: "05 - Fix Linux line endings"
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/\r$//' "$PROJECT_DIR/gradlew"
          find "$PROJECT_DIR" -type f \( -name '*.sh' -o -name '*.gradle' -o -name '*.gradle.kts' -o -name '*.properties' -o -name '*.xml' -o -name '*.cmake' -o -name 'CMakeLists.txt' \) -exec sed -i 's/\r$//' {} \;
          chmod +x "$PROJECT_DIR/gradlew"

      - name: "06 - Set up JDK 17"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: "07 - Set up Android SDK"
        uses: android-actions/setup-android@v3

      - name: "08 - Install Android SDK components"
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.2.11394342" "cmake;3.22.1"

      - name: "09 - Verify native source"
        shell: bash
        run: |
          set -euo pipefail
          CPP="$PROJECT_DIR/app/src/main/cpp"
          [ -d "$CPP" ] || { echo "ERROR: Native source not found: $CPP"; exit 1; }

      - name: "10 - Fix Linux case-sensitive native headers"
        shell: bash
        run: |
          set -euo pipefail
          CPP="$PROJECT_DIR/app/src/main/cpp"

          PLAYER="$(find "$CPP" -type f -iname 'playertablist.h' -print | head -n 1 || true)"
          if [ -n "$PLAYER" ]; then
            cp -f "$PLAYER" "$(dirname "$PLAYER")/playerTabList.h"
          fi

          RGBA="$(find "$CPP" -type f -iname 'RGBA.h' -print | head -n 1 || true)"
          if [ -n "$RGBA" ]; then
            cp -f "$RGBA" "$(dirname "$RGBA")/RGBA.h"
          fi

      - name: "11 - Fix RakNet and BitStream"
        shell: bash
        run: |
          set -euo pipefail
          CPP="$PROJECT_DIR/app/src/main/cpp"
          VENDOR="$CPP/samp/vendor"
          RAKNET="$VENDOR/RakNet"
          mkdir -p "$VENDOR" "$RAKNET"

          OLD_RAKNET="$(find "$VENDOR" -maxdepth 1 -type d -iname 'raknet' -print | head -n 1 || true)"
          if [ -n "$OLD_RAKNET" ] && [ "$OLD_RAKNET" != "$RAKNET" ] && [ ! -d "$RAKNET" ]; then
            mv "$OLD_RAKNET" "$RAKNET"
          fi

          TARGET="$RAKNET/BitStream.h"
          if [ ! -f "$TARGET" ]; then
            FOUND="$(find "$CPP" -type f \( -iname 'BitStream.h' -o -iname 'bitstream.h' -o -iname 'BitStream.hpp' \) -print | head -n 1 || true)"
            if [ -n "$FOUND" ]; then
              cp -f "$FOUND" "$TARGET"
            fi
          fi

          if [ ! -f "$TARGET" ]; then
            echo "ERROR: Required RakNet header missing: $TARGET"
            find "$CPP" -type f | grep -Ei 'bitstream|raknet' | head -100 || true
            exit 1
          fi

          find "$CPP" -type f \( -name '*.cpp' -o -name '*.c' -o -name '*.h' -o -name '*.hpp' \) -print0 | xargs -0 -r sed -i \
            -e 's|vendor/raknet/|vendor/RakNet/|g' \
            -e 's|"raknet/|"RakNet/|g' \
            -e "s|'raknet/|'RakNet/|g"

          echo "BitStream.h OK: $TARGET"

      - name: "12 - Verify Dexin Mobile server target"
        shell: bash
        run: |
          set -euo pipefail
          echo "Dexin Mobile server target: 5.57.37.215:7777"
          grep -Rni -E '5\.57\.37\.215|7777' "$PROJECT_DIR/app/src/main" 2>/dev/null | head -50 || true

      - name: "13 - Patch optional build settings"
        shell: bash
        run: |
          set -euo pipefail
          BG="$PROJECT_DIR/app/build.gradle"
          if [ -f "$BG" ]; then
            sed -i 's/nativeSymbolUploadEnabled[[:space:]]\+true/nativeSymbolUploadEnabled false/g' "$BG" || true
          fi

      - name: "14 - Clean previous build"
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PROJECT_DIR/app/.cxx" "$PROJECT_DIR/app/build"

      - name: "15 - Gradle version"
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --version

      - name: "16 - Gradle clean"
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace clean

      - name: "17 - Build Release APK"
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          echo "=== DEXIN MOBILE APK BUILD START ==="
          ./gradlew --no-daemon --stacktrace --warning-mode all --build-cache :app:assembleRelease 2>&1 | tee /tmp/gradle-build.log
          echo "=== DEXIN MOBILE APK BUILD FINISHED ==="

      - name: "18 - Upload build log on failure"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DexinMobile-build-log
          path: /tmp/gradle-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: "19 - Find generated APK"
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          find "$PROJECT_DIR" -type f -name '*.apk' -print
          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/release"
          test -d "$APK_DIR"
          ls -lh "$APK_DIR"

      - name: "20 - Upload Release APK"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DexinMobile-Release-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
