name: Build SA-MP Launcher

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Reassemble Parts and Build Release APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check source parts
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            sampstable_DexinMobile_updatedPart1.zip \
            sampstable_DexinMobile_updatedPart2.zip \
            sampstable_DexinMobile_updatedPart3.zip; do
            test -f "$f"
            echo "Found: $f"
            ls -lh "$f"
          done

      - name: Install archive tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zip unzip p7zip-full

      - name: Reassemble and recover multipart source
        shell: bash
        run: |
          set -euo pipefail

          P1="sampstable_DexinMobile_updatedPart1.zip"
          P2="sampstable_DexinMobile_updatedPart2.zip"
          P3="sampstable_DexinMobile_updatedPart3.zip"

          rm -rf _source
          mkdir -p _source

          echo "=========================================="
          echo "REASSEMBLING BINARY PARTS"
          echo "=========================================="

          cat "$P1" "$P2" "$P3" > full_source.zip
          ls -lh full_source.zip

          echo "Testing normal ZIP..."
          if unzip -t full_source.zip >/tmp/zip-test.log 2>&1; then
            echo "NORMAL ZIP TEST PASSED"
            unzip -q full_source.zip -d _source
          else
            echo "Normal ZIP test failed. Trying ZIP recovery..."
            cat /tmp/zip-test.log || true

            rm -f repaired_source.zip

            if zip -FF full_source.zip --out repaired_source.zip >/tmp/zip-repair.log 2>&1; then
              echo "zip -FF completed. Testing repaired archive..."

              if unzip -t repaired_source.zip >/tmp/repaired-test.log 2>&1; then
                echo "REPAIRED ZIP TEST PASSED"
                unzip -q repaired_source.zip -d _source
              else
                echo "Repaired ZIP is still invalid."
                cat /tmp/repaired-test.log || true
                echo "Trying 7-Zip as a final recovery method..."
                rm -rf _source/*
                if 7z t full_source.zip >/tmp/7z-test.log 2>&1; then
                  7z x -y full_source.zip -o_source
                else
                  cat /tmp/7z-test.log || true
                  exit 1
                fi
              fi
            else
              cat /tmp/zip-repair.log || true
              echo "Trying 7-Zip as a final recovery method..."
              if 7z t full_source.zip >/tmp/7z-test.log 2>&1; then
                7z x -y full_source.zip -o_source
              else
                cat /tmp/7z-test.log || true
                exit 1
              fi
            fi
          fi

          echo "=========================================="
          echo "SOURCE EXTRACTION COMPLETE"
          echo "=========================================="
          find _source -type f -name gradlew -print

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail
          GRADLEW="$(find _source -type f -name gradlew | head -n 1)"
          test -n "$GRADLEW"
          PROJECT_DIR="$(dirname "$GRADLEW")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Fix Linux line endings
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/\r$//' "$PROJECT_DIR/gradlew"
          find "$PROJECT_DIR" -type f \( -name '*.sh' -o -name '*.gradle' -o -name '*.gradle.kts' -o -name '*.properties' -o -name '*.xml' -o -name '*.cmake' -o -name 'CMakeLists.txt' \) -exec sed -i 's/\r$//' {} \;
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0' 'ndk;26.2.11394342' 'cmake;3.22.1'

      - name: Fix Linux case-sensitive headers (RakNet)
        shell: bash
        run: |
          set -euo pipefail
          CPP="$PROJECT_DIR/app/src/main/cpp"
          VENDOR="$CPP/samp/vendor"
          test -d "$CPP"
          test -d "$VENDOR"

          PLAYER="$(find "$CPP" -type f -iname 'playertablist.h' | head -n 1 || true)"
          if [ -n "$PLAYER" ]; then
            cp -f "$PLAYER" "$(dirname "$PLAYER")/playerTabList.h"
          fi

          RGBA="$(find "$CPP" -type f -iname 'RGBA.h' | head -n 1 || true)"
          if [ -n "$RGBA" ]; then
            cp -f "$RGBA" "$(dirname "$RGBA")/RGBA.h"
          fi

          if [ -d "$VENDOR/raknet" ] && [ ! -d "$VENDOR/RakNet" ]; then
            mv "$VENDOR/raknet" "$VENDOR/RakNet"
          fi

          test -d "$VENDOR/RakNet"

          find "$CPP" -type f \( -name '*.cpp' -o -name '*.c' -o -name '*.h' -o -name '*.hpp' \) -print0 | xargs -0 -r sed -i -e 's|vendor/raknet/|vendor/RakNet/|g' -e 's|vendor/RakNet/raknet/|vendor/RakNet/|g' -e 's|"raknet/|"RakNet/|g' -e "s|'raknet/|'RakNet/|g"

          EXPECTED="$VENDOR/RakNet/BitStream.h"
          if [ ! -f "$EXPECTED" ]; then
            BITSTREAM="$(find "$CPP" -type f -iname 'BitStream.h' | head -n 1 || true)"
            if [ -n "$BITSTREAM" ]; then
              cp -f "$BITSTREAM" "$EXPECTED"
            else
              echo 'ERROR: BitStream.h not found.'
              exit 1
            fi
          fi
          test -f "$EXPECTED"

      - name: Verify server configuration
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS="$PROJECT_DIR/app/src/main/cpp/samp/settings.cpp"
          if [ -f "$SETTINGS" ]; then
            echo 'Checking server configuration...'
            grep -n -E '5\.57\.37\.215|7777' "$SETTINGS" || true
          fi

      - name: Create temporary keystore for CI
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$PROJECT_DIR/keystore_playmarket2.jks"
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair -alias my-key-alias -keyalg RSA -keysize 2048 -validity 10000 -keystore "$KEYSTORE" -storepass 'EDrp131211aA!!pass' -keypass 'EDrp131211aA!!pass' -dname 'CN=SA-MP CI, OU=CI, O=SA-MP, L=City, ST=State, C=US' -noprompt
          fi
          test -f "$KEYSTORE"

      - name: Patch build.gradle
        shell: bash
        run: |
          set -euo pipefail
          BG="$PROJECT_DIR/app/build.gradle"
          if [ -f "$BG" ]; then
            sed -i 's/nativeSymbolUploadEnabled true/nativeSymbolUploadEnabled false/g' "$BG" || true
          fi

      - name: Remove old build dirs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PROJECT_DIR/app/.cxx" "$PROJECT_DIR/app/build"

      - name: Check Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --version

      - name: Gradle clean
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace clean

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace --warning-mode all :app:assembleRelease 2>&1 | tee /tmp/gradle-build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/gradle-build.log
          retention-days: 7

      - name: Find generated APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          find "$PROJECT_DIR" -type f -name '*.apk' -print
          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/release"
          test -d "$APK_DIR"
          ls -lh "$APK_DIR"

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SA-MP-Launcher-Release-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
