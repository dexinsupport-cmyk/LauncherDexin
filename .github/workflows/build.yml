name: Build SA-MP Launcher

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Reassemble Parts and Build Release APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check source parts
        shell: bash
        run: |
          set -euo pipefail
          test -f sampstable_github_readyPart1.zip
          test -f sampstable_github_readyPart2.zip
          test -f sampstable_github_readyPart3.zip
          ls -lh sampstable_github_readyPart*.zip

      - name: Reassemble original ZIP
        shell: bash
        run: |
          set -euo pipefail
          cat sampstable_github_readyPart1.zip sampstable_github_readyPart2.zip sampstable_github_readyPart3.zip > sampstable_github_ready.zip
          ls -lh sampstable_github_ready.zip

      - name: Verify reconstructed ZIP
        shell: bash
        run: |
          set -euo pipefail
          unzip -t sampstable_github_ready.zip

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _source
          mkdir -p _source
          unzip -q sampstable_github_ready.zip -d _source
          find _source -type f -name gradlew -print

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail
          GRADLEW="$(find _source -type f -name gradlew | head -n 1)"
          test -n "$GRADLEW"
          PROJECT_DIR="$(dirname "$GRADLEW")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Fix Linux line endings
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/\r$//' "$PROJECT_DIR/gradlew"
          find "$PROJECT_DIR" -type f \( -name "*.sh" -o -name "*.gradle" -o -name "*.gradle.kts" -o -name "*.properties" -o -name "*.xml" -o -name "*.cmake" -o -name "CMakeLists.txt" \) -exec sed -i 's/\r$//' {} \; || true
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.2.11394342" "cmake;3.22.1"

      - name: Fix Linux case-sensitive headers
        shell: bash
        run: |
          set -euo pipefail
          CPP="$PROJECT_DIR/app/src/main/cpp"

          PLAYER="$(find "$CPP" -type f -iname "playertablist.h" -print | head -n 1 || true)"
          if [ -n "$PLAYER" ]; then
            DIR="$(dirname "$PLAYER")"
            cp -f "$PLAYER" "$DIR/playerTabList.h"
            echo "playerTabList.h fixed."
          fi

          RGBA="$(find "$CPP" -type f -iname "RGBA.h" -print | head -n 1 || true)"
          if [ -n "$RGBA" ]; then
            DIR="$(dirname "$RGBA")"
            cp -f "$RGBA" "$DIR/RGBA.h"
            echo "RGBA.h fixed."
          fi

      - name: Locate and fix RakNet BitStream.h
        shell: bash
        run: |
          set -euo pipefail

          CPP="$PROJECT_DIR/app/src/main/cpp"
          EXPECTED="$CPP/samp/vendor/RakNet/BitStream.h"

          if [ -f "$EXPECTED" ]; then
            echo "BitStream.h already exists."
            exit 0
          fi

          echo "BitStream.h missing. Searching source..."
          FOUND="$(find "$CPP" -type f -iname "BitStream.h" -print | head -n 1 || true)"

          if [ -n "$FOUND" ]; then
            echo "Found: $FOUND"
            mkdir -p "$(dirname "$EXPECTED")"
            cp -f "$FOUND" "$EXPECTED"
            test -f "$EXPECTED"
            echo "BitStream.h copied successfully."
          else
            echo "ERROR: BitStream.h does not exist anywhere in the extracted source."
            echo "RakNet-related files:"
            find "$CPP" -type f \( -iname "*raknet*" -o -iname "*bitstream*" \) -print || true
            echo "RakNet directories:"
            find "$CPP" -type d \( -iname "RakNet" -o -iname "raknet" \) -print || true
            exit 1
          fi

      - name: Verify native headers
        shell: bash
        run: |
          set -euo pipefail
          CPP="$PROJECT_DIR/app/src/main/cpp"

          test -f "$CPP/samp/vendor/RakNet/BitStream.h"
          echo "RakNet BitStream.h: OK"

          find "$CPP" -type f -name "playerTabList.h" -print || true
          find "$CPP" -type f -name "RGBA.h" -print || true

      - name: Remove old CMake and Gradle build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PROJECT_DIR/app/.cxx"
          rm -rf "$PROJECT_DIR/app/build"

      - name: Check Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --version

      - name: Gradle clean
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace clean

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "STARTING RELEASE APK BUILD"
          echo "=========================================="

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            :app:assembleRelease

          echo "=========================================="
          echo "RELEASE BUILD FINISHED"
          echo "=========================================="

      - name: Find generated APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SA-MP-Launcher-Release-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
