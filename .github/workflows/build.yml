name: Build SA-MP Launcher

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Reassemble 3 Parts and Build APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # =====================================================
      # SOURCE IS SPLIT INTO 3 RAW PARTS
      # Part 1 + Part 2 + Part 3 = original ZIP archive
      # IMPORTANT: These files are NOT separate ZIP archives.
      # =====================================================
      - name: Check 3 source parts
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking 3 split source parts..."

          test -f "sampstable_github_readyPart1.zip"
          test -f "sampstable_github_readyPart2.zip"
          test -f "sampstable_github_readyPart3.zip"

          echo "Part 1: $(stat -c%s sampstable_github_readyPart1.zip) bytes"
          echo "Part 2: $(stat -c%s sampstable_github_readyPart2.zip) bytes"
          echo "Part 3: $(stat -c%s sampstable_github_readyPart3.zip) bytes"
          echo "✓ All 3 parts found."

      - name: Reassemble original ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Reassembling original archive from Part 1 + Part 2 + Part 3..."

          cat \
            sampstable_github_readyPart1.zip \
            sampstable_github_readyPart2.zip \
            sampstable_github_readyPart3.zip \
            > sampstable_github_ready.zip

          echo "Reassembled size: $(stat -c%s sampstable_github_ready.zip) bytes"

          echo "Testing ZIP integrity..."
          unzip -t sampstable_github_ready.zip

          echo "✓ ZIP integrity check passed."

      - name: Extract complete source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _source
          mkdir -p _source

          unzip -q sampstable_github_ready.zip -d _source

          test -d "_source/sampstable"
          test -f "_source/sampstable/gradlew"
          test -f "_source/sampstable/settings.gradle"
          test -f "_source/sampstable/app/build.gradle"

          echo "✓ Complete source extracted."

      # =====================================================
      # JAVA 17 - required by AGP 8.x
      # =====================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # =====================================================
      # ANDROID SDK
      # =====================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.2.11394342" \
            "cmake;3.22.1"

          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME/ndk/26.2.11394342"

      # =====================================================
      # PREPARE PROJECT
      # =====================================================
      - name: Prepare Gradle project
        working-directory: _source/sampstable
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          # AGP 8.2.1 is used by this project.
          # Use Gradle 8.2.1 for the most reliable AGP compatibility.
          sed -i 's#gradle-[0-9.]*-bin.zip#gradle-8.2.1-bin.zip#' gradle/wrapper/gradle-wrapper.properties

          echo "Gradle wrapper configuration:"
          cat gradle/wrapper/gradle-wrapper.properties

          # The app expects this keystore at the project root.
          if [ ! -f "keystore_playmarket2.jks" ]; then
            echo "Creating CI signing keystore..."
            keytool -genkeypair \
              -v \
              -keystore "keystore_playmarket2.jks" \
              -storepass 'EDrp131211aA!!pass' \
              -keypass 'EDrp131211aA!!pass' \
              -alias 'my-key-alias' \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=SA-MP Launcher, OU=CI, O=SA-MP, L=Unknown, ST=Unknown, C=US"
          fi

      # =====================================================
      # BUILD
      # =====================================================
      - name: Build Release APK
        working-directory: _source/sampstable
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew --no-daemon --stacktrace --warning-mode all :app:assembleRelease

      # =====================================================
      # SHOW APK
      # =====================================================
      - name: Find generated APK
        shell: bash
        run: |
          set -euo pipefail

          echo "Generated APK files:"
          find _source/sampstable/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

      # =====================================================
      # UPLOAD APK AS GITHUB ACTIONS ARTIFACT
      # =====================================================
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SA-MP-Launcher-Release-APK
          path: _source/sampstable/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
