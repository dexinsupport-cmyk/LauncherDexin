name: Build Dexin Mobile APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble source parts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t PARTS < <(
            for n in 1 2 3; do
              f="$(find . -maxdepth 2 -type f \( -name "DexinMobile_Verify_SourcePart${n}.zip" -o -name "*SourcePart${n}.zip" \) -print -quit)"
              [ -n "$f" ] || { echo "ERROR: SourcePart${n}.zip not found"; exit 1; }
              printf '%s\n' "$f"
            done
          )
          cat "${PARTS[@]}" > source.zip
          unzip -t source.zip
          rm -rf _source
          mkdir -p _source
          unzip -q source.zip -d _source

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail
          G="$(find _source -type f -name gradlew -print -quit)"
          [ -n "$G" ] || { echo "ERROR: gradlew not found"; exit 1; }
          D="$(cd "$(dirname "$G")" && pwd)"
          echo "PROJECT_DIR=$D" >> "$GITHUB_ENV"
          sed -i 's/\r$//' "$D/gradlew"
          chmod +x "$D/gradlew"
          echo "PROJECT_DIR=$D"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.2.11394342" "cmake;3.22.1"

      - name: Prepare native source tree
        shell: bash
        run: |
          set -euo pipefail
          C="$PROJECT_DIR/app/src/main/cpp"
          S="$C/samp"
          REAL_RAKNET="$S/vendor/raknet"
          MIRROR_RAKNET="$S/vendor/RakNet"
          SAMP_CMAKE="$S/CMakeLists.txt"
          test -d "$S" || { echo "ERROR: samp directory not found"; exit 1; }
          test -d "$REAL_RAKNET" || { echo "ERROR: vendor/raknet not found"; exit 1; }

          # Compatibility directory is header-only. This prevents Network.h
          # from failing on Linux due to RakNet/RakNet case differences.
          rm -rf "$MIRROR_RAKNET"
          mkdir -p "$MIRROR_RAKNET"
          while IFS= read -r -d '' f; do
            rel="${f#"$REAL_RAKNET"/}"
            mkdir -p "$MIRROR_RAKNET/$(dirname "$rel")"
            cp -f "$f" "$MIRROR_RAKNET/$rel"
          done < <(find "$REAL_RAKNET" -type f \( -iname '*.h' -o -iname '*.hpp' -o -iname '*.inl' \) -print0)

          # Remove any accidental implementation files from the compatibility tree.
          find "$MIRROR_RAKNET" -type f \( -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.cxx' \) -delete

          echo "RakNet implementation copies currently present:"
          find "$S" -type f \( -iname 'BitStream.cpp' -o -iname 'DS_ByteQueue.cpp' -o -iname 'PluginInterface.cpp' -o -iname 'PluginInterface2.cpp' -o -iname 'RakPeer.cpp' -o -iname 'RakClient.cpp' \) -print | sort

      - name: Fix CMake source list - unique paths and unique RakNet implementations
        shell: bash
        run: |
          set -euo pipefail
          S="$PROJECT_DIR/app/src/main/cpp/samp"
          CMAKE="$S/CMakeLists.txt"

          # Do NOT replace the project's source discovery with another GLOB.
          # First let the original CMake files construct the samp target.
          # Then, at the end of samp/CMakeLists.txt, normalize its SOURCES list.
          # CMake's list(REMOVE_DUPLICATES) removes repeated source paths; the
          # extra RakNet filter handles separate copies of the same implementation
          # under differently-cased/vendor directories.
          python3 - "$CMAKE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          text = p.read_text(encoding='utf-8')
          marker = '# DEXIN_UNIQUE_SAMP_SOURCES'
          if marker not in text:
              block = r'''

# DEXIN_UNIQUE_SAMP_SOURCES
# Normalize the final target source list after all target_sources/add_library
# calls in this directory have executed.
if(TARGET samp)
  get_target_property(_dexin_sources samp SOURCES)
  if(_dexin_sources)
    list(REMOVE_DUPLICATES _dexin_sources)

    # Keep one canonical implementation for the RakNet translation units that
    # are known to produce duplicate symbols when two RakNet trees are present.
    set(_dexin_raknet_names
      BitStream.cpp
      DS_ByteQueue.cpp
      PluginInterface.cpp
      PluginInterface2.cpp
      RakPeer.cpp
      RakClient.cpp
      RakNetCommandParser.cpp
      NetworkTypes.cpp
      DS_HuffmanEncodingTree.cpp
      DS_Table.cpp
    )

    set(_dexin_filtered_sources "")
    foreach(_dexin_src IN LISTS _dexin_sources)
      get_filename_component(_dexin_abs "${_dexin_src}" ABSOLUTE BASE_DIR "${CMAKE_CURRENT_SOURCE_DIR}")
      get_filename_component(_dexin_name "${_dexin_abs}" NAME)

      set(_dexin_skip FALSE)
      list(FIND _dexin_raknet_names "${_dexin_name}" _dexin_raknet_index)
      if(NOT _dexin_raknet_index EQUAL -1)
        string(TOLOWER "${_dexin_abs}" _dexin_lower)
        # Only the canonical lower-case vendor/raknet tree supplies RakNet .cpp files.
        if(_dexin_lower MATCHES "/vendor/raknet/")
          set(_dexin_skip FALSE)
        else()
          set(_dexin_skip TRUE)
        endif()
      endif()

      if(NOT _dexin_skip)
        list(APPEND _dexin_filtered_sources "${_dexin_src}")
      endif()
    endforeach()

    list(REMOVE_DUPLICATES _dexin_filtered_sources)
    set_property(TARGET samp PROPERTY SOURCES "${_dexin_filtered_sources}")
    message(STATUS "DEXIN: normalized samp SOURCES: ${_dexin_filtered_sources}")
  endif()
endif()
'''
              p.write_text(text.rstrip() + block + '\n', encoding='utf-8')
              print('Appended DEXIN target-source normalization to', p)
          else:
              print('DEXIN target-source normalization already present')
          PY

          # Also make sure the uppercase compatibility tree can never be compiled.
          if grep -RIlE 'vendor/RakNet|vendor/raknet' "$S" --include='CMakeLists.txt' | grep -q .; then
            echo "CMake RakNet references:"
            grep -RInE 'vendor/RakNet|vendor/raknet' "$S" --include='CMakeLists.txt' | head -n 100 || true
          fi

      - name: Remove native build caches
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PROJECT_DIR/app/.cxx" "$PROJECT_DIR/app/build"

      - name: Build Release APK
        id: gradle_build
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          : > /tmp/gradle-build.log
          ./gradlew --no-daemon --stacktrace --warning-mode all clean 2>&1 | tee -a /tmp/gradle-build.log
          s=${PIPESTATUS[0]}
          if [ "$s" -eq 0 ]; then
            ./gradlew --no-daemon --stacktrace --warning-mode all :app:assembleRelease 2>&1 | tee -a /tmp/gradle-build.log
            s=${PIPESTATUS[0]}
          fi
          echo "GRADLE_EXIT=$s" >> /tmp/gradle-build.log
          exit "$s"

      - name: Show Gradle diagnostics in Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Dexin Mobile — Build diagnostics'
            echo
            echo "**Build Release APK:** ${{ steps.gradle_build.outcome }}"
            echo
            echo '```text'
            grep -nEi 'error:|fatal error:|FAILED:|FAILURE:|Execution failed|What went wrong|Caused by:|Could not find|Could not resolve|undefined reference|duplicate class|duplicate symbol|GRADLE_EXIT=' /tmp/gradle-build.log | tail -n 250 || true
            echo '```'
            echo
            echo '### Last 300 lines'
            echo '```text'
            tail -n 300 /tmp/gradle-build.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DexinMobile-gradle-diagnostics
          path: /tmp/gradle-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if Gradle failed
        if: steps.gradle_build.outcome != 'success'
        run: exit 1

      - name: Copy APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/release" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          [ -n "$APK" ] || { echo "ERROR: APK was not generated"; exit 1; }
          cp "$APK" DexinMobile.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DexinMobile-APK
          path: DexinMobile.apk
          if-no-files-found: error
          retention-days: 14
