name: Build Dexin Mobile APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble source parts
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t PARTS < <(
            find . -maxdepth 2 -type f -name '*.zip' -print0 |
            while IFS= read -r -d '' f; do
              b="$(basename "$f")"
              if [[ "$b" =~ [Pp]art([0-9]+)(-[^/]*)?\.zip$ ]]; then
                printf '%s\t%s\n' "${BASH_REMATCH[1]}" "$f"
              fi
            done |
            sort -n -k1,1 |
            cut -f2-
          )

          [ "${#PARTS[@]}" -gt 0 ] || {
            echo "ERROR: no source Part*.zip files found"
            exit 1
          }

          expected=1
          for p in "${PARTS[@]}"; do
            b="$(basename "$p")"
            [[ "$b" =~ [Pp]art([0-9]+) ]] || exit 1
            [ "${BASH_REMATCH[1]}" -eq "$expected" ] || {
              echo "ERROR: expected Part${expected}, found $b"
              exit 1
            }
            expected=$((expected + 1))
          done

          echo "Parts found:"
          printf ' - %s\n' "${PARTS[@]}"

          cat "${PARTS[@]}" > source.zip
          unzip -t source.zip

          rm -rf _source
          mkdir -p _source
          unzip -q source.zip -d _source

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail
          G="$(find _source -type f -name gradlew -print -quit)"
          [ -n "$G" ] || { echo "ERROR: gradlew not found"; exit 1; }
          D="$(cd "$(dirname "$G")" && pwd)"
          echo "PROJECT_DIR=$D" >> "$GITHUB_ENV"
          sed -i 's/\r$//' "$D/gradlew"
          chmod +x "$D/gradlew"
          echo "Gradle project: $D"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.2.11394342" \
            "cmake;3.22.1"

      - name: Fix Linux native include paths
        shell: bash
        run: |
          set -euo pipefail

          C="$PROJECT_DIR/app/src/main/cpp"
          S="$C/samp"
          REAL_RAKNET="$S/vendor/raknet"
          MIRROR_RAKNET="$S/vendor/RakNet"

          test -d "$S" || { echo "ERROR: samp native directory not found: $S"; exit 1; }
          test -d "$REAL_RAKNET" || { echo "ERROR: vendor/raknet not found: $REAL_RAKNET"; exit 1; }

          mkdir -p "$S/gui/samp_widgets" "$S/game"

          copy_case_insensitive() {
            local pattern="$1"
            local target="$2"
            local found
            found="$(find "$C" -type f -iname "$pattern" -print -quit || true)"
            [ -n "$found" ] || {
              echo "ERROR: required header '$pattern' was not found"
              exit 1
            }
            cp -f "$found" "$target"
          }

          copy_case_insensitive "playerTabList.h" "$S/gui/samp_widgets/playerTabList.h"
          copy_case_insensitive "RGBA.h" "$S/game/RGBA.h"

          # Network.h includes ../vendor/RakNet/*.h on Linux, while the real
          # source tree is vendor/raknet. The uppercase compatibility tree
          # MUST contain headers only. If it contains .cpp files, CMake can
          # compile RakNet twice and the linker reports duplicate symbols.
          rm -rf "$MIRROR_RAKNET"
          mkdir -p "$MIRROR_RAKNET"

          # Copy every header/inl from the real tree while preserving its
          # relative directory layout. Never copy C/C++ implementation files.
          while IFS= read -r -d '' src; do
            rel="${src#"$REAL_RAKNET"/}"
            dst="$MIRROR_RAKNET/$rel"
            mkdir -p "$(dirname "$dst")"
            cp -f "$src" "$dst"
          done < <(
            find "$REAL_RAKNET" -type f \
              \( -iname '*.h' -o -iname '*.hpp' -o -iname '*.inl' \) \
              -print0
          )

          # Required headers. RakPeer.h itself includes Export.h.
          for h in RakClient.h RakPeer.h Export.h BitStream.h RakNetTypes.h; do
            test -f "$MIRROR_RAKNET/$h" || {
              echo "ERROR: required RakNet header missing: $h"
              exit 1
            }
          done

          # Safety check: compatibility tree must never contain implementation files.
          if find "$MIRROR_RAKNET" -type f \
            \( -name '*.cpp' -o -name '*.cc' -o -name '*.cxx' -o -name '*.c' \) \
            -print -quit | grep -q .; then
            echo "ERROR: implementation file found in vendor/RakNet"
            find "$MIRROR_RAKNET" -type f \
              \( -name '*.cpp' -o -name '*.cc' -o -name '*.cxx' -o -name '*.c' \)
            exit 1
          fi

          echo "RakNet compatibility headers prepared."
          ls -la "$MIRROR_RAKNET" | head -n 100

      - name: Remove native build caches
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PROJECT_DIR/app/.cxx"
          rm -rf "$PROJECT_DIR/app/build"
          echo "Removed CMake/Gradle native build caches."

      - name: Verify RakNet source duplication
        shell: bash
        run: |
          set -euo pipefail
          C="$PROJECT_DIR/app/src/main/cpp/samp"

          echo "RakNet implementation files:"
          find "$C/vendor" -type f \
            \( -name '*.cpp' -o -name '*.cc' -o -name '*.cxx' \) \
            | sort | sed -n '1,250p'

          echo
          echo "Checking uppercase compatibility tree..."
          if find "$C/vendor/RakNet" -type f \
            \( -name '*.cpp' -o -name '*.cc' -o -name '*.cxx' \) \
            | grep -q .; then
            echo "ERROR: duplicate RakNet implementation sources detected"
            exit 1
          fi

          test -f "$C/vendor/RakNet/RakClient.h"
          test -f "$C/vendor/RakNet/RakPeer.h"
          test -f "$C/vendor/RakNet/Export.h"
          echo "OK: RakNet compatibility directory contains headers only."

      - name: Build Release APK
        id: gradle_build
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          : > /tmp/gradle-build.log
          ./gradlew --no-daemon --stacktrace --warning-mode all clean 2>&1 | tee -a /tmp/gradle-build.log
          s=${PIPESTATUS[0]}
          if [ "$s" -eq 0 ]; then
            ./gradlew --no-daemon --stacktrace --warning-mode all :app:assembleRelease 2>&1 | tee -a /tmp/gradle-build.log
            s=${PIPESTATUS[0]}
          fi
          echo "GRADLE_EXIT=$s" >> /tmp/gradle-build.log
          exit "$s"

      - name: Show Gradle diagnostics in Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Dexin Mobile — Build diagnostics'
            echo
            echo "**Build Release APK:** ${{ steps.gradle_build.outcome }}"
            echo
            echo '```text'
            grep -nEi 'error:|fatal error:|FAILED:|FAILURE:|Execution failed|What went wrong|Caused by:|Could not find|Could not resolve|undefined reference|duplicate class|duplicate symbol|GRADLE_EXIT=' /tmp/gradle-build.log | tail -n 250 || true
            echo '```'
            echo
            echo '### Last 300 lines'
            echo '```text'
            tail -n 300 /tmp/gradle-build.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DexinMobile-gradle-diagnostics
          path: /tmp/gradle-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if Gradle failed
        if: steps.gradle_build.outcome != 'success'
        run: exit 1

      - name: Copy APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/release" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          [ -n "$APK" ] || { echo "ERROR: APK was not generated"; exit 1; }
          cp "$APK" DexinMobile.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DexinMobile-APK
          path: DexinMobile.apk
          if-no-files-found: error
          retention-days: 14
