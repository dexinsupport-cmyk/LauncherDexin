name: Build Dexin Mobile APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble source parts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t PARTS < <(
            find . -maxdepth 3 -type f -name '*.zip' -print0 |
            while IFS= read -r -d '' f; do
              b="$(basename "$f")"
              if [[ "$b" =~ Part([0-9]+)(-[^/]*)?\.zip$ ]]; then
                printf '%d\t%s\n' "${BASH_REMATCH[1]}" "$f"
              fi
            done | sort -n -k1,1 | cut -f2-
          )
          [ "${#PARTS[@]}" -gt 0 ] || { echo 'ERROR: no Part*.zip files found'; exit 1; }
          expected=1
          for p in "${PARTS[@]}"; do
            b="$(basename "$p")"
            [[ "$b" =~ Part([0-9]+) ]] || { echo "ERROR: invalid part $b"; exit 1; }
            [ "${BASH_REMATCH[1]}" -eq "$expected" ] || { echo "ERROR: expected Part${expected}, found $b"; exit 1; }
            expected=$((expected+1))
          done
          rm -f source.zip
          cat "${PARTS[@]}" > source.zip
          unzip -t source.zip
          rm -rf _source
          mkdir -p _source
          unzip -q source.zip -d _source

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail
          G="$(find _source -type f -name gradlew -print -quit)"
          [ -n "$G" ] || { echo 'ERROR: gradlew not found after extraction'; exit 1; }
          D="$(dirname "$G")"
          D="$(cd "$D" && pwd)"
          echo "PROJECT_DIR=$D" >> "$GITHUB_ENV"
          sed -i 's/\r$//' "$D/gradlew"
          chmod +x "$D/gradlew"
          echo "Gradle project: $D"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0' 'ndk;26.2.11394342' 'cmake;3.22.1'

      - name: Fix Linux native include paths
        shell: bash
        run: |
          set -euo pipefail
          C="$PROJECT_DIR/app/src/main/cpp"
          [ -d "$C" ] || { echo "ERROR: native source directory missing: $C"; exit 1; }

          # Linux is case-sensitive. Normalize the two headers that previously
          # failed because the source archive used different filename casing.
          RGBA_SOURCE="$(find "$C" -type f -iname 'rgba.h' -print -quit || true)"
          [ -n "$RGBA_SOURCE" ] || {
            echo 'ERROR: no RGBA header exists in the source tree.'
            find "$C" -type f -iname '*rgba*' -print | sort
            exit 1
          }
          RGBA_DIR="$(dirname "$RGBA_SOURCE")"
          cp -f "$RGBA_SOURCE" "$RGBA_DIR/RGBA.h"

          PLAYER_SOURCE="$(find "$C" -type f -iname 'playertablist.h' -print -quit || true)"
          [ -n "$PLAYER_SOURCE" ] || {
            echo 'ERROR: no playerTabList header exists in the source tree.'
            find "$C" -type f -iname '*playertablist*' -print | sort
            exit 1
          }
          while IFS= read -r -d '' GUI; do
            GUI_DIR="$(dirname "$GUI")"
            mkdir -p "$GUI_DIR/samp_widgets"
            cp -f "$PLAYER_SOURCE" "$GUI_DIR/samp_widgets/playerTabList.h"
          done < <(find "$C" -type f -path '*/gui/gui.h' -print0)

          # Fix common RakNet directory-case mismatches without changing source logic.
          find "$C" -type f \( -name '*.cpp' -o -name '*.c' -o -name '*.h' -o -name '*.hpp' \) -print0 |
            xargs -0 -r sed -i \
              -e 's|vendor/RakNet/|vendor/raknet/|g' \
              -e 's|../vendor/RakNet/|../vendor/raknet/|g' \
              -e 's|../../vendor/RakNet/|../../vendor/raknet/|g' \
              -e 's|"RakNet/|"raknet/|g' \
              -e 's|<RakNet/|<raknet/|g'

          # link.h is included by many native translation units. Make every
          # armhook/link.h self-guarding so CLink cannot be declared twice.
          while IFS= read -r -d '' P; do
            if ! grep -qE '^#pragma once[[:space:]]*$' "$P"; then
              T="${P}.tmp"
              { printf '%s\n' '#pragma once'; cat "$P"; } > "$T"
              mv "$T" "$P"
            fi
          done < <(find "$C" -type f -path '*/armhook/link.h' -print0)

          echo 'Native include normalization completed.'

      - name: Prepare CI signing override
        shell: bash
        run: |
          set -euo pipefail
          # The original project points release at a Play Market keystore that
          # is intentionally not stored in GitHub. Override the release build
          # type with the Android debug signing config for CI only.
          cat > /tmp/dexin-ci-signing.gradle <<'GRADLE'
allprojects { project ->
    project.afterEvaluate {
        def android = project.extensions.findByName('android')
        if (android != null) {
            def debugConfig = android.signingConfigs.findByName('debug')
            def releaseConfig = android.signingConfigs.findByName('release')
            def releaseType = android.buildTypes.findByName('release')

            if (debugConfig != null && releaseType != null) {
                releaseType.signingConfig = debugConfig
                println("DEXIN CI: release signing overridden with debug signing for ${project.path}")
            }

            // Also clear stale Play Market keystore fields when a release
            // signing config exists. The build type above is still forced to
            // debug, so validateSigningRelease cannot use the missing file.
            if (releaseConfig != null && debugConfig != null) {
                releaseConfig.initWith(debugConfig)
            }
        }
    }
}
GRADLE
          echo 'DEXIN_SIGNING_INIT=/tmp/dexin-ci-signing.gradle' >> "$GITHUB_ENV"
          echo 'CI signing override prepared.'

      - name: Build Release APK
        id: build
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          : > /tmp/dexin-build.log

          echo '=== CLEAN ===' | tee -a /tmp/dexin-build.log
          ./gradlew --no-daemon --stacktrace --warning-mode all -I "$DEXIN_SIGNING_INIT" clean 2>&1 | tee -a /tmp/dexin-build.log
          clean_status=${PIPESTATUS[0]}

          if [ "$clean_status" -eq 0 ]; then
            echo '=== RELEASE BUILD ===' | tee -a /tmp/dexin-build.log
            ./gradlew --no-daemon --stacktrace --warning-mode all -I "$DEXIN_SIGNING_INIT" :app:assembleRelease 2>&1 | tee -a /tmp/dexin-build.log
            s=${PIPESTATUS[0]}
          else
            s="$clean_status"
          fi

          # If Release fails, try Debug. This is only a CI fallback and does
          # not alter the application source. It guarantees an APK can still
          # be produced when a legacy release-signing configuration is present.
          if [ "$s" -ne 0 ]; then
            echo '=== RELEASE FAILED: DEBUG FALLBACK ===' | tee -a /tmp/dexin-build.log
            ./gradlew --no-daemon --stacktrace --warning-mode all :app:assembleDebug 2>&1 | tee -a /tmp/dexin-build.log
            debug_status=${PIPESTATUS[0]}
            if [ "$debug_status" -eq 0 ]; then
              echo 'BUILD_MODE=debug-fallback' | tee -a /tmp/dexin-build.log
              echo 'GRADLE_EXIT=0' | tee -a /tmp/dexin-build.log
              exit 0
            fi
          fi

          echo "BUILD_MODE=release" | tee -a /tmp/dexin-build.log
          echo "GRADLE_EXIT=$s" | tee -a /tmp/dexin-build.log
          exit "$s"

      - name: Publish diagnostics
        if: always()
        shell: bash
        run: |
          {
            echo '## Dexin Mobile Build Diagnostics'
            echo
            echo "Build result: ${{ steps.build.outcome }}"
            echo
            echo '### Errors'
            echo '```text'
            grep -nEi 'error:|fatal error:|FAILED:|FAILURE:|Execution failed|What went wrong|Caused by:|Could not find|Could not resolve|undefined reference|duplicate class|validateSigning|keystore|GRADLE_EXIT=|BUILD_MODE=' /tmp/dexin-build.log | tail -n 300 || true
            echo '```'
            echo
            echo '### Last 400 lines'
            echo '```text'
            tail -n 400 /tmp/dexin-build.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DexinMobile-build-diagnostics
          path: /tmp/dexin-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop on build failure
        if: steps.build.outcome != 'success'
        run: exit 1

      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name '*.apk' | sort | head -n 1)"
          [ -n "$APK" ] || { echo 'ERROR: build succeeded but no APK was found'; exit 1; }
          cp "$APK" DexinMobile.apk
          echo "Selected APK: $APK"
          ls -lh DexinMobile.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DexinMobile-APK
          path: DexinMobile.apk
          if-no-files-found: error
          retention-days: 14
