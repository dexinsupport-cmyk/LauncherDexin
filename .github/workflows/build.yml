name: Build SA-MP Launcher

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Dexin Mobile APK
    runs-on: ubuntu-22.04

    steps:

      - name: "01 - Checkout"
        uses: actions/checkout@v4

      - name: "02 - Check source parts"
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking source parts..."

          test -f "sampstable_github_readyPart1.zip"
          test -f "sampstable_github_readyPart2.zip"
          test -f "sampstable_github_readyPart3.zip"

          echo "Part 1 OK"
          echo "Part 2 OK"
          echo "Part 3 OK"

          ls -lh \
            "sampstable_github_readyPart1.zip" \
            "sampstable_github_readyPart2.zip" \
            "sampstable_github_readyPart3.zip"

      - name: "03 - Reassemble source ZIP"
        shell: bash
        run: |
          set -euo pipefail

          echo "Reassembling source..."

          cat \
            "sampstable_github_readyPart1.zip" \
            "sampstable_github_readyPart2.zip" \
            "sampstable_github_readyPart3.zip" \
            > "sampstable_github_ready.zip"

          echo "Testing ZIP..."

          unzip -t "sampstable_github_ready.zip"

          echo "SOURCE ZIP IS VALID"

      - name: "04 - Extract source"
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "_source"
          mkdir -p "_source"

          unzip -q \
            "sampstable_github_ready.zip" \
            -d "_source"

          echo "Source extracted."

          find "_source" \
            -type f \
            -name "gradlew" \
            -print

      - name: "05 - Locate Gradle project"
        shell: bash
        run: |
          set -euo pipefail

          GRADLEW="$(find "_source" -type f -name "gradlew" | head -n 1)"

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Gradle project:"
          echo "$PROJECT_DIR"

      - name: "06 - Fix Linux line endings"
        shell: bash
        run: |
          set -euo pipefail

          sed -i 's/\r$//' "$PROJECT_DIR/gradlew"

          find "$PROJECT_DIR" \
            -type f \
            \( \
              -name "*.sh" \
              -o -name "*.gradle" \
              -o -name "*.gradle.kts" \
              -o -name "*.properties" \
              -o -name "*.xml" \
              -o -name "*.cmake" \
              -o -name "CMakeLists.txt" \
            \) \
            -exec sed -i 's/\r$//' {} \;

          chmod +x "$PROJECT_DIR/gradlew"

          echo "Line endings fixed."

      - name: "07 - Set up JDK 17"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: "08 - Set up Android SDK"
        uses: android-actions/setup-android@v3

      - name: "09 - Install Android dependencies"
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.2.11394342" \
            "cmake;3.22.1"

          echo "Android dependencies installed."

      - name: "10 - Fix native headers"
        shell: bash
        run: |
          set -euo pipefail

          CPP="$PROJECT_DIR/app/src/main/cpp"

          echo "Checking native source..."

          test -d "$CPP"

          PLAYER="$(find "$CPP" \
            -type f \
            -iname "playertablist.h" \
            | head -n 1 || true)"

          if [ -n "$PLAYER" ]; then
            cp -f \
              "$PLAYER" \
              "$(dirname "$PLAYER")/playerTabList.h"

            echo "playerTabList.h fixed."
          fi

          RGBA="$(find "$CPP" \
            -type f \
            -iname "RGBA.h" \
            | head -n 1 || true)"

          if [ -n "$RGBA" ]; then
            cp -f \
              "$RGBA" \
              "$(dirname "$RGBA")/RGBA.h"

            echo "RGBA.h fixed."
          fi

      - name: "11 - Fix RakNet"
        shell: bash
        run: |
          set -euo pipefail

          CPP="$PROJECT_DIR/app/src/main/cpp"
          VENDOR="$CPP/samp/vendor"

          test -d "$VENDOR"

          if [ -d "$VENDOR/raknet" ] && [ ! -d "$VENDOR/RakNet" ]; then
            mv "$VENDOR/raknet" "$VENDOR/RakNet"
          fi

          test -d "$VENDOR/RakNet"

          if [ ! -f "$VENDOR/RakNet/BitStream.h" ]; then

            BITSTREAM="$(find "$CPP" \
              -type f \
              -iname "BitStream.h" \
              | head -n 1 || true)"

            if [ -z "$BITSTREAM" ]; then
              echo "ERROR: BitStream.h not found."
              exit 1
            fi

            cp -f \
              "$BITSTREAM" \
              "$VENDOR/RakNet/BitStream.h"
          fi

          find "$CPP" \
            -type f \
            \( \
              -name "*.cpp" \
              -o -name "*.c" \
              -o -name "*.h" \
              -o -name "*.hpp" \
            \) \
            -print0 \
            | xargs -0 -r sed -i \
              -e 's|vendor/raknet/|vendor/RakNet/|g' \
              -e 's|"raknet/|"RakNet/|g' \
              -e "s|'raknet/|'RakNet/|g"

          echo "RakNet fixed."

      - name: "12 - Verify Dexin server"
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS="$PROJECT_DIR/app/src/main/cpp/samp/settings.cpp"

          if [ -f "$SETTINGS" ]; then
            echo "Checking server configuration..."

            grep -n \
              -E "5\.57\.37\.215|7777" \
              "$SETTINGS" || true
          fi

          echo "Server check completed."

      - name: "13 - Create CI keystore"
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE="$PROJECT_DIR/keystore_playmarket2.jks"

          if [ ! -f "$KEYSTORE" ]; then

            keytool -genkeypair \
              -alias my-key-alias \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -keystore "$KEYSTORE" \
              -storepass 'EDrp131211aA!!pass' \
              -keypass 'EDrp131211aA!!pass' \
              -dname "CN=SA-MP CI, OU=CI, O=SA-MP, L=City, ST=State, C=US" \
              -noprompt

          fi

          test -f "$KEYSTORE"

      - name: "14 - Patch build.gradle"
        shell: bash
        run: |
          set -euo pipefail

          BG="$PROJECT_DIR/app/build.gradle"

          if [ -f "$BG" ]; then

            sed -i \
              's/nativeSymbolUploadEnabled[[:space:]]\+true/nativeSymbolUploadEnabled false/g' \
              "$BG" || true

          fi

      - name: "15 - Clean build"
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            "$PROJECT_DIR/app/.cxx" \
            "$PROJECT_DIR/app/build"

      - name: "16 - Check Gradle"
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --version

      - name: "17 - Build Release APK"
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DEXIN MOBILE BUILD START"
          echo "=========================================="

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            --build-cache \
            --parallel \
            :app:assembleRelease \
            2>&1 | tee /tmp/gradle-build.log

          echo "=========================================="
          echo "DEXIN MOBILE BUILD FINISHED"
          echo "=========================================="

      - name: "18 - Upload build log on failure"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/gradle-build.log
          retention-days: 7

      - name: "19 - Find APK"
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          test -d \
            "$PROJECT_DIR/app/build/outputs/apk/release"

          ls -lh \
            "$PROJECT_DIR/app/build/outputs/apk/release"

      - name: "20 - Upload Release APK"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SA-MP-Launcher-Release-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
