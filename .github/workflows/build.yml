name: Build SA-MP Launcher

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Reassemble Parts and Build Release APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check source parts
        shell: bash
        run: |
          set -euo pipefail
          test -f sampstable_DexinMobile_updatedPart1.zip
          test -f sampstable_DexinMobile_updatedPart2.zip
          test -f sampstable_DexinMobile_updatedPart3.zip
          ls -lh sampstable_DexinMobile_updatedPart*.zip

      - name: Reassemble original ZIP
        shell: bash
        run: |
          set -euo pipefail
          cat sampstable_DexinMobile_updatedPart1.zip sampstable_DexinMobile_updatedPart2.zip sampstable_DexinMobile_updatedPart3.zip > sampstable_github_ready.zip
          ls -lh sampstable_github_ready.zip

      - name: Verify reconstructed ZIP
        shell: bash
        run: |
          set -euo pipefail
          unzip -t sampstable_github_ready.zip

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _source
          mkdir -p _source
          unzip -q sampstable_github_ready.zip -d _source
          find _source -type f -name gradlew -print

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail
          GRADLEW="$(find _source -type f -name gradlew | head -n 1)"
          test -n "$GRADLEW"
          PROJECT_DIR="$(dirname "$GRADLEW")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Fix Linux line endings
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/\r$//' "$PROJECT_DIR/gradlew"
          find "\( PROJECT_DIR" -type f \( -name "*.sh" -o -name "*.gradle" -o -name "*.gradle.kts" -o -name "*.properties" -o -name "*.xml" -o -name "*.cmake" -o -name "CMakeLists.txt" \) -exec sed -i 's/\r \)//' {} \; || true
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.2.11394342" "cmake;3.22.1"

      - name: Fix Linux case-sensitive headers (RakNet)
        shell: bash
        run: |
          set -euo pipefail
          CPP="$PROJECT_DIR/app/src/main/cpp"
          VENDOR="$CPP/samp/vendor"

          PLAYER="$(find "$CPP" -type f -iname "playertablist.h" | head -n 1 || true)"
          if [ -n "$PLAYER" ]; then
            DIR="$(dirname "$PLAYER")"
            cp -f "$PLAYER" "$DIR/playerTabList.h"
            echo "playerTabList.h fixed"
          fi

          RGBA="$(find "$CPP" -type f -iname "RGBA.h" | head -n 1 || true)"
          if [ -n "$RGBA" ]; then
            DIR="$(dirname "$RGBA")"
            cp -f "$RGBA" "$DIR/RGBA.h"
            echo "RGBA.h fixed"
          fi

          RAKNET_DIR="$(find "$VENDOR" -maxdepth 1 -type d \( -name "raknet" -o -name "RakNet" \) | head -n 1 || true)"
          if [ -z "$RAKNET_DIR" ]; then
            echo "ERROR: raknet/RakNet directory not found"
            ls -la "$VENDOR" || true
            exit 1
          fi
          echo "Found RakNet dir: $RAKNET_DIR"

          if [ "$(basename "$RAKNET_DIR")" = "raknet" ]; then
            mv "$RAKNET_DIR" "$VENDOR/RakNet"
            echo "Renamed raknet -> RakNet"
          fi

          echo "Patching includes: raknet -> RakNet"
          find "$CPP" -type f \( -name "*.cpp" -o -name "*.c" -o -name "*.h" -o -name "*.hpp" \) -print0 | \
            xargs -0 sed -i 's|vendor/raknet/|vendor/RakNet/|g' || true
          find "$CPP" -type f \( -name "*.cpp" -o -name "*.c" -o -name "*.h" -o -name "*.hpp" \) -print0 | \
            xargs -0 sed -i 's|"raknet/|"RakNet/|g' || true
          find "$CPP" -type f \( -name "*.cpp" -o -name "*.c" -o -name "*.h" -o -name "*.hpp" \) -print0 | \
            xargs -0 sed -i "s|'raknet/|'RakNet/|g" || true

          echo "Contents of RakNet:"
          ls -la "$VENDOR/RakNet/" | head -30 || true

      - name: Create temporary keystore for CI
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$PROJECT_DIR/keystore_playmarket2.jks"
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair \
              -alias my-key-alias \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -keystore "$KEYSTORE" \
              -storepass 'EDrp131211aA!!pass' \
              -keypass 'EDrp131211aA!!pass' \
              -dname "CN=SA-MP CI, OU=CI, O=SA-MP, L=City, ST=State, C=US" \
              -noprompt
            echo "Temporary keystore created"
          fi
          ls -lh "$KEYSTORE"

      - name: Patch build.gradle
        shell: bash
        run: |
          set -euo pipefail
          BG="$PROJECT_DIR/app/build.gradle"
          sed -i 's/nativeSymbolUploadEnabled true/nativeSymbolUploadEnabled false/g' "$BG" || true
          echo "build.gradle patched"

      - name: Remove old build dirs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PROJECT_DIR/app/.cxx"
          rm -rf "$PROJECT_DIR/app/build"

      - name: Check Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --version

      - name: Gradle clean
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace clean || true

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          echo "=========================================="
          echo "STARTING RELEASE APK BUILD"
          echo "=========================================="
          ./gradlew \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            :app:assembleRelease 2>&1 | tee /tmp/gradle-build.log
          echo "=========================================="
          echo "RELEASE BUILD FINISHED"
          echo "=========================================="

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/gradle-build.log
          retention-days: 3

      - name: Find generated APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          find "$PROJECT_DIR" -type f -name "*.apk" -print
          ls -lh "$PROJECT_DIR/app/build/outputs/apk/release/" || true

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SA-MP-Launcher-Release-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
