name: Build SA-MP Launcher

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    name: Build Dexin Mobile APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect and assemble source parts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t PARTS < <(
            find . -maxdepth 2 -type f -name '*.zip' -print0 |
            while IFS= read -r -d '' f; do
              b="$(basename "$f")"
              if [[ "$b" =~ Part([0-9]+)(-[^/]*)?\.zip$ ]]; then
                printf '%d\t%s\n' "${BASH_REMATCH[1]}" "$f"
              fi
            done | sort -n -k1,1 | cut -f2-
          )
          [ "${#PARTS[@]}" -gt 0 ] || { echo 'ERROR: no source Part*.zip files found'; exit 1; }
          expected=1
          for part in "${PARTS[@]}"; do
            b="$(basename "$part")"
            [[ "$b" =~ Part([0-9]+)(-[^/]*)?\.zip$ ]] || { echo "ERROR: invalid part filename: $b"; exit 1; }
            num="${BASH_REMATCH[1]}"
            if [ "$num" -ne "$expected" ]; then
              echo "ERROR: expected Part${expected}, found Part${num}: $b"
              exit 1
            fi
            expected=$((expected+1))
          done
          rm -f source.zip
          cat "${PARTS[@]}" > source.zip
          unzip -t source.zip
          rm -rf _source
          mkdir -p _source
          unzip -q source.zip -d _source

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail
          G="$(find _source -type f -name gradlew -print -quit)"
          [ -n "$G" ] || { echo 'ERROR: gradlew not found after source extraction'; exit 1; }
          D="$(dirname "$G")"
          echo "PROJECT_DIR=$D" >> "$GITHUB_ENV"
          sed -i 's/\r$//' "$D/gradlew"
          chmod +x "$D/gradlew"

      - name: Replace VerifyActivity with offline DexinMobile verifier
        shell: bash
        run: |
          set -euo pipefail
          V="$PROJECT_DIR/app/src/main/java/com/samp/mobile/launcher/VerifyActivity.java"
          test -f "$V" || { echo "ERROR: VerifyActivity.java not found: $V"; exit 1; }
          cat > "$V" <<'JAVA'
          package com.samp.mobile.launcher;

          import android.os.Bundle;
          import android.os.Environment;
          import android.view.View;
          import android.widget.Button;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;
          import com.samp.mobile.R;
          import java.io.File;

          public class VerifyActivity extends AppCompatActivity {
              private TextView statusIcon, statusTitle, statusDetails, pathText;
              private Button verifyButton;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_verify);
                  statusIcon = findViewById(R.id.verify_icon);
                  statusTitle = findViewById(R.id.verify_title);
                  statusDetails = findViewById(R.id.verify_details);
                  pathText = findViewById(R.id.verify_path);
                  verifyButton = findViewById(R.id.verify_button);
                  pathText.setText("Game files: /storage/emulated/0/DexinMobile/");
                  verifyButton.setOnClickListener(v -> verifyFiles());
                  verifyFiles();
              }

              private File gameDir() {
                  return new File(Environment.getExternalStorageDirectory(), "DexinMobile");
              }

              private void checking() {
                  statusIcon.setText("…");
                  statusIcon.setTextColor(getResources().getColor(R.color.white));
                  statusTitle.setText("VERIFYING");
                  statusTitle.setTextColor(getResources().getColor(R.color.white));
                  statusDetails.setText("Checking DexinMobile game files offline...");
                  verifyButton.setEnabled(false);
              }

              private void verified(int files) {
                  statusIcon.setText("✓");
                  statusIcon.setTextColor(getResources().getColor(R.color.verify_green));
                  statusTitle.setText("VERIFY");
                  statusTitle.setTextColor(getResources().getColor(R.color.verify_green));
                  statusDetails.setText("Game files are installed correctly.\nFiles checked: " + files);
                  verifyButton.setEnabled(true);
              }

              private void notVerified(String reason) {
                  statusIcon.setText("!");
                  statusIcon.setTextColor(getResources().getColor(R.color.verify_red));
                  statusTitle.setText("NO VERIFY");
                  statusTitle.setTextColor(getResources().getColor(R.color.verify_red));
                  statusDetails.setText(reason);
                  verifyButton.setEnabled(true);
              }

              private void verifyFiles() {
                  checking();
                  new Thread(() -> {
                      try {
                          File root = gameDir();
                          if (!root.isDirectory()) {
                              runOnUiThread(() -> notVerified("DexinMobile folder was not found."));
                              return;
                          }

                          String[] requiredDirs = {"anim", "audio", "data", "fonts", "models", "SAMP", "texdb", "Text", "Textures"};
                          String[] missingDirs = new String[requiredDirs.length];
                          int missing = 0;
                          for (String name : requiredDirs) {
                              File d = new File(root, name);
                              if (!d.isDirectory() || d.list() == null || d.list().length == 0) {
                                  missingDirs[missing++] = name;
                              }
                          }

                          String[] requiredFiles = {"CINFO.BIN", "gtasatelem.set", "stream.ini"};
                          StringBuilder missingFiles = new StringBuilder();
                          for (String name : requiredFiles) {
                              File f = new File(root, name);
                              if (!f.isFile() || f.length() <= 0) {
                                  if (missingFiles.length() > 0) missingFiles.append(", ");
                                  missingFiles.append(name);
                              }
                          }

                          int[] counts = scan(root);
                          int bad = counts[1];
                          int total = counts[0];

                          if (missing > 0 || missingFiles.length() > 0 || bad > 0 || total < 10) {
                              StringBuilder msg = new StringBuilder("Game files are incomplete or damaged.");
                              if (missing > 0) {
                                  msg.append("\nMissing/empty folders: ");
                                  for (int i = 0; i < missing; i++) {
                                      if (i > 0) msg.append(", ");
                                      msg.append(missingDirs[i]);
                                  }
                              }
                              if (missingFiles.length() > 0) msg.append("\nMissing/empty files: ").append(missingFiles);
                              if (bad > 0) msg.append("\nZero-byte files: ").append(bad);
                              if (total < 10) msg.append("\nToo few game files detected.");
                              runOnUiThread(() -> notVerified(msg.toString()));
                          } else {
                              final int checked = total;
                              runOnUiThread(() -> verified(checked));
                          }
                      } catch (Exception e) {
                          runOnUiThread(() -> notVerified("Could not read the DexinMobile game folder."));
                      }
                  }).start();
              }

              private int[] scan(File dir) {
                  int files = 0, bad = 0;
                  File[] list = dir.listFiles();
                  if (list == null) return new int[]{0, 0};
                  for (File f : list) {
                      if (f.isDirectory()) {
                          int[] x = scan(f);
                          files += x[0];
                          bad += x[1];
                      } else if (f.isFile()) {
                          files++;
                          if (f.length() == 0) bad++;
                      }
                  }
                  return new int[]{files, bad};
              }
          }
          JAVA
          sed -i 's/^          //' "$V"
          grep -q 'offline DexinMobile verifier' /dev/null 2>/dev/null || true
          echo "Offline VerifyActivity installed: $V"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0' 'ndk;26.2.11394342' 'cmake;3.22.1'

      - name: Create CI signing keystore
        shell: bash
        run: |
          set -euo pipefail
          K="$PROJECT_DIR/keystore_playmarket2.jks"
          P='DexinCI_2026_Release_Key!'
          rm -f "$K"
          keytool -genkeypair -alias my-key-alias -keyalg RSA -keysize 2048 -validity 10000 \
            -keystore "$K" -storepass "$P" -keypass "$P" \
            -dname 'CN=Dexin Mobile, OU=Release, O=Dexin Mobile, L=Dexin, ST=NA, C=US' -noprompt

      - name: Fix native Linux case sensitivity
        shell: bash
        run: |
          set -euo pipefail
          C="$PROJECT_DIR/app/src/main/cpp"
          [ -d "$C" ] || { echo "ERROR: native source directory missing: $C"; exit 1; }
          P="$(find "$C" -type f -iname 'playertablist.h' -print -quit || true)"
          [ -z "$P" ] || cp -f "$P" "$(dirname "$P")/playerTabList.h"
          R="$(find "$C" -type f -iname 'RGBA.h' -print -quit || true)"
          [ -z "$R" ] || cp -f "$R" "$(dirname "$R")/RGBA.h"
          V="$C/samp"
          RD="$(find "$V" -maxdepth 2 -type d -iname 'raknet' -print -quit || true)"
          [ -n "$RD" ] || { echo 'ERROR: RakNet directory missing'; exit 1; }
          find "$C" -type f \( -name '*.cpp' -o -name '*.c' -o -name '*.h' -o -name '*.hpp' \) -print0 |
            xargs -0 -r sed -i \
              -e 's|vendor/RakNet/|vendor/raknet/|g' \
              -e 's|"RakNet/|"raknet/|g' \
              -e 's|\.\./vendor/RakNet/|../vendor/raknet/|g'
          for H in BitStream.h RakClientInterface.h RakClient.h; do
            F="$(find "$RD" -maxdepth 1 -type f -iname "$H" -print -quit || true)"
            [ -n "$F" ] || { echo "ERROR: $H missing"; exit 1; }
            [ "$(basename "$F")" = "$H" ] || cp -f "$F" "$RD/$H"
          done

      - name: Fix release signing configuration
        shell: bash
        run: |
          set -euo pipefail
          BG="$PROJECT_DIR/app/build.gradle"
          PASS='DexinCI_2026_Release_Key!'
          K="$PROJECT_DIR/keystore_playmarket2.jks"
          test -f "$BG" && test -f "$K"
          sed -Ei "s|^([[:space:]]*storePassword[[:space:]]+).*$|\1'$PASS'|" "$BG" || true
          sed -Ei "s|^([[:space:]]*keyPassword[[:space:]]+).*$|\1'$PASS'|" "$BG" || true
          sed -Ei "s|^([[:space:]]*storeFile[[:space:]]+file\()[^)]*(\).*)$|\1'../keystore_playmarket2.jks'\2|" "$BG" || true

      - name: Patch deprecated repository
        shell: bash
        run: |
          set -euo pipefail
          find "$PROJECT_DIR" -type f -name '*.gradle' -print0 |
            xargs -0 -r sed -i 's/jcenter()/mavenCentral()/g'

      - name: Clean
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew --no-daemon clean

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace --warning-mode all :app:assembleRelease 2>&1 | tee /tmp/gradle-build.log

      - name: Prepare APK output
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/release" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          [ -n "$APK" ] || { echo 'ERROR: release APK not found'; exit 1; }
          cp "$APK" DexinMobile.apk
          ls -lh DexinMobile.apk
          file DexinMobile.apk

      - name: Upload actual APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DexinMobile-APK
          path: DexinMobile.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK as GitHub Release asset
        if: success() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dexinmobile-${{ github.run_number }}
          name: Dexin Mobile APK ${{ github.run_number }}
          generate_release_notes: false
          files: DexinMobile.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DexinMobile-build-log
          path: /tmp/gradle-build.log
          retention-days: 7
