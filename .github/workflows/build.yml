name: Build SA-MP Launcher

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Reassemble 3 Parts and Build APK
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # =====================================================
      # 1 - CHECK 3 SPLIT PARTS
      # =====================================================

      - name: Check source parts
        shell: bash
        run: |
          set -euxo pipefail

          test -f "sampstable_github_readyPart1.zip"
          test -f "sampstable_github_readyPart2.zip"
          test -f "sampstable_github_readyPart3.zip"

          echo "Part 1 OK"
          echo "Part 2 OK"
          echo "Part 3 OK"

      # =====================================================
      # 2 - REASSEMBLE ORIGINAL ZIP
      # =====================================================

      - name: Reassemble original ZIP
        shell: bash
        run: |
          set -euxo pipefail

          rm -f sampstable_github_ready.zip

          cat \
            sampstable_github_readyPart1.zip \
            sampstable_github_readyPart2.zip \
            sampstable_github_readyPart3.zip \
            > sampstable_github_ready.zip

          unzip -t sampstable_github_ready.zip

      # =====================================================
      # 3 - EXTRACT
      # =====================================================

      - name: Extract complete source
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf _source
          mkdir -p _source

          unzip -q sampstable_github_ready.zip -d _source

          echo "Extracted source:"
          find _source -maxdepth 4 -type f -name "gradlew" -print

      # =====================================================
      # 4 - FIND GRADLE PROJECT
      # =====================================================

      - name: Find Gradle project
        shell: bash
        run: |
          set -euxo pipefail

          PROJECT=$(find _source -type f -name gradlew | head -1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Gradle project:"
          echo "$PROJECT_DIR"

      # =====================================================
      # 5 - FIX WINDOWS LINE ENDINGS
      # =====================================================

      - name: Fix Linux line endings
        shell: bash
        run: |
          set -euxo pipefail

          sed -i 's/\r$//' "$PROJECT_DIR/gradlew"

          find "$PROJECT_DIR" \
            -type f \
            \( -name "*.sh" -o -name "*.gradle" -o -name "*.gradle.kts" \) \
            -exec sed -i 's/\r$//' {} \; || true

          chmod +x "$PROJECT_DIR/gradlew"

      # =====================================================
      # 6 - SETUP JAVA
      # =====================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # =====================================================
      # 7 - ANDROID SDK
      # =====================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK NDK CMake
        shell: bash
        run: |
          set -euxo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.2.11394342" \
            "cmake;3.22.1"

      # =====================================================
      # 8 - FIX NATIVE SOURCE
      # =====================================================

      - name: Fix native Linux case sensitivity
        shell: bash
        run: |
          set -euxo pipefail

          CPP="$PROJECT_DIR/app/src/main/cpp"

          echo "CPP directory:"
          echo "$CPP"

          echo ""
          echo "Searching for player tab list headers..."

          find "$CPP" \
            -type f \
            \( -iname "*playertab*" -o -iname "*player*tab*" \) \
            -print || true

          echo ""
          echo "Checking known location..."

          WIDGET="$CPP/samp/gui/samp_widgets"

          mkdir -p "$WIDGET"

          # Actual file from source is playertablist.h
          if [ -f "$WIDGET/playertablist.h" ]; then

            echo "Found:"
            echo "$WIDGET/playertablist.h"

            cp -f \
              "$WIDGET/playertablist.h" \
              "$WIDGET/playerTabList.h"

          elif [ -f "$WIDGET/PlayerTabList.h" ]; then

            echo "Found:"
            echo "$WIDGET/PlayerTabList.h"

            cp -f \
              "$WIDGET/PlayerTabList.h" \
              "$WIDGET/playerTabList.h"

          else

            echo "ERROR:"
            echo "player tab list header does not exist."

            find "$CPP/samp/gui" \
              -type f \
              -maxdepth 5 \
              -print

            exit 1
          fi

          test -f "$WIDGET/playerTabList.h"

          echo ""
          echo "Header fixed successfully:"
          ls -la "$WIDGET/"*player*tab* 2>/dev/null || true

      # =====================================================
      # 9 - VERIFY INCLUDE
      # =====================================================

      - name: Verify gui.h include
        shell: bash
        run: |
          set -euxo pipefail

          GUI="$PROJECT_DIR/app/src/main/cpp/samp/gui/gui.h"
          HEADER="$PROJECT_DIR/app/src/main/cpp/samp/gui/samp_widgets/playerTabList.h"

          test -f "$GUI"
          test -f "$HEADER"

          echo "gui.h:"
          grep -n "playerTabList" "$GUI" || true

          echo ""
          echo "Header:"
          ls -lh "$HEADER"

      # =====================================================
      # 10 - REMOVE OLD CMAKE CACHE
      # =====================================================

      - name: Remove CMake cache
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$PROJECT_DIR/app/.cxx"
          rm -rf "$PROJECT_DIR/app/build"

      # =====================================================
      # 11 - GRADLE CLEAN
      # =====================================================

      - name: Gradle clean
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean

      # =====================================================
      # 12 - BUILD RELEASE APK
      # =====================================================

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================"
          echo "BUILDING RELEASE APK"
          echo "======================================"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            :app:assembleRelease

      # =====================================================
      # 13 - FIND APK
      # =====================================================

      - name: Find generated APK
        if: success()
        shell: bash
        run: |
          echo "======================================"
          echo "APK FILES"
          echo "======================================"

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      # =====================================================
      # 14 - UPLOAD APK
      # =====================================================

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SA-MP-Launcher-Release
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
