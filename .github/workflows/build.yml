name: Build SA-MP Launcher

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Launcher
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # =====================================================
      # SOURCE PARTS
      # این سورس به 3 پارت تقسیم شده است:
      # Part 1 / Part 2 / Part 3
      # =====================================================
      - name: Check source parts
        run: |
          set -e

          echo "Checking split source..."

          test -f "sampstable_github_readyPart1.zip"
          test -f "sampstable_github_readyPart2.zip"
          test -f "sampstable_github_readyPart3.zip"

          echo "✓ Part 1 found"
          echo "✓ Part 2 found"
          echo "✓ Part 3 found"

      - name: Extract Part 1
        run: |
          mkdir -p source/part1
          unzip -q "sampstable_github_readyPart1.zip" -d source/part1

      - name: Extract Part 2
        run: |
          mkdir -p source/part2
          unzip -q "sampstable_github_readyPart2.zip" -d source/part2

      - name: Extract Part 3
        run: |
          mkdir -p source/part3
          unzip -q "sampstable_github_readyPart3.zip" -d source/part3

      # =====================================================
      # MERGE SOURCE PARTS
      # =====================================================
      - name: Merge source parts
        run: |
          set -e

          mkdir -p _source

          cp -a source/part1/. _source/
          cp -a source/part2/. _source/
          cp -a source/part3/. _source/

          echo "✓ All 3 parts merged."

          echo "Source contents:"
          find _source -maxdepth 2 -type f | head -100

      # =====================================================
      # JAVA
      # =====================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # =====================================================
      # ANDROID SDK
      # =====================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # =====================================================
      # FIND GRADLE PROJECT
      # =====================================================
      - name: Find Gradle project
        run: |
          echo "Searching for Gradle project..."

          find _source -name "gradlew" -type f -print

      # =====================================================
      # BUILD
      # =====================================================
      - name: Build Release APK
        shell: bash
        run: |
          set -e

          PROJECT=$(find "_source" -name "gradlew" -type f | head -1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: gradlew was not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "Gradle project:"
          echo "$PROJECT_DIR"

          cd "$PROJECT_DIR"

          chmod +x ./gradlew

          ./gradlew --no-daemon --stacktrace :app:assembleRelease

      # =====================================================
      # APK
      # =====================================================
      - name: Find APK
        run: |
          echo "Generated APK files:"

          find _source \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SA-MP-Launcher-APK
          path: |
            _source/**/build/outputs/apk/release/*.apk
            _source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
