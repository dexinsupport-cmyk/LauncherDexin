name: Build Dexin Mobile APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble source parts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t PARTS < <(
            find . -maxdepth 3 -type f -name '*.zip' -print0 |
            while IFS= read -r -d '' f; do
              b="$(basename "$f")"
              if [[ "$b" =~ Part([0-9]+)(-[^/]*)?\.zip$ ]]; then
                printf '%d\t%s\n' "${BASH_REMATCH[1]}" "$f"
              fi
            done | sort -n -k1,1 | cut -f2-
          )
          [ "${#PARTS[@]}" -gt 0 ] || { echo 'ERROR: no Part*.zip files found'; exit 1; }
          expected=1
          for p in "${PARTS[@]}"; do
            b="$(basename "$p")"
            [[ "$b" =~ Part([0-9]+) ]] || { echo "ERROR: invalid part $b"; exit 1; }
            [ "${BASH_REMATCH[1]}" -eq "$expected" ] || { echo "ERROR: expected Part${expected}, found $b"; exit 1; }
            expected=$((expected+1))
          done
          rm -f source.zip
          cat "${PARTS[@]}" > source.zip
          unzip -t source.zip
          rm -rf _source
          mkdir _source
          unzip -q source.zip -d _source

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail
          G="$(find _source -type f -name gradlew -print -quit)"
          [ -n "$G" ] || { echo 'ERROR: gradlew not found after extraction'; exit 1; }
          D="$(dirname "$G")"
          echo "PROJECT_DIR=$D" >> "$GITHUB_ENV"
          sed -i 's/\r$//' "$D/gradlew"
          chmod +x "$D/gradlew"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0' 'ndk;26.2.11394342' 'cmake;3.22.1'

      - name: Fix Linux native include paths
        shell: bash
        run: |
          set -euo pipefail
          C="$PROJECT_DIR/app/src/main/cpp"
          [ -d "$C" ] || { echo "ERROR: native source directory missing: $C"; exit 1; }

          # Linux is case-sensitive. Normalize RakNet include spelling.
          find "$C" -type f \( -name '*.cpp' -o -name '*.c' -o -name '*.h' -o -name '*.hpp' \) -print0 |
            xargs -0 -r sed -i \
              -e 's|vendor/RakNet/|vendor/raknet/|g' \
              -e 's|../vendor/RakNet/|../vendor/raknet/|g' \
              -e 's|../../vendor/RakNet/|../../vendor/raknet/|g' \
              -e 's|"RakNet/|"raknet/|g' \
              -e 's|<RakNet/|<raknet/|g'

          # Protect armhook/link.h against repeated inclusion.
          while IFS= read -r -d '' p; do
            if ! grep -qE '^#pragma once[[:space:]]*$' "$p"; then
              tmp="${p}.tmp"
              { echo '#pragma once'; cat "$p"; } > "$tmp"
              mv "$tmp" "$p"
            fi
          done < <(find "$C" -type f -path '*/armhook/link.h' -print0)

          # Resolve playerTabList.h case/path issues. Both gui.h and
          # gui/samp_widgets/playertablist.cpp include this header with a
          # local quoted include, so the header must exist beside each
          # source file that includes it.
          PLAYER_HEADER="$(find "$C" -type f -iname 'playerTabList.h' -print -quit || true)"
          if [ -z "$PLAYER_HEADER" ]; then
            echo 'ERROR: playerTabList.h is missing from the extracted source.'
            echo 'Files containing playertablist in their name:'
            find "$C" -type f -iname '*playertablist*' -print | sort || true
            exit 1
          fi
          echo "Using playerTabList header: $PLAYER_HEADER"

          while IFS= read -r -d '' CPP; do
            CPP_DIR="$(dirname "$CPP")"
            cp -f "$PLAYER_HEADER" "$CPP_DIR/playerTabList.h"
            echo "Placed playerTabList.h beside: $CPP"
          done < <(find "$C" -type f \( -name 'playertablist.cpp' -o -iname 'playertablist.cpp' \) -print0)

          # gui.h also refers to samp_widgets/playerTabList.h. Make that
          # exact path available from every gui directory containing gui.h.
          while IFS= read -r -d '' GUI; do
            GUI_DIR="$(dirname "$GUI")"
            TARGET_DIR="$GUI_DIR/samp_widgets"
            mkdir -p "$TARGET_DIR"
            cp -f "$PLAYER_HEADER" "$TARGET_DIR/playerTabList.h"
            echo "Placed gui include header: $TARGET_DIR/playerTabList.h"
          done < <(find "$C" -type f -path '*/gui/gui.h' -print0)

          # Also normalize any case-only include spelling in native sources.
          find "$C" -type f \( -name '*.cpp' -o -name '*.c' -o -name '*.h' -o -name '*.hpp' \) -print0 |
            xargs -0 -r sed -i -E 's/([#][[:space:]]*include[[:space:]]*[<"])([Pp]layer[Tt]ab[Ll]ist)\.h([>"])/\1playerTabList.h\3/g'

          PLAYER_FOUND="$(find "$C" -type f -name 'playerTabList.h' -print -quit || true)"
          [ -n "$PLAYER_FOUND" ] || { echo 'ERROR: playerTabList.h could not be provided'; exit 1; }

          # Resolve RGBA includes robustly.
          RGBA_SOURCE="$(find "$C" -type f \( -iname 'RGBA.h' -o -iname 'RGBA.hpp' -o -iname 'rgba.inc' \) -print -quit || true)"
          if [ -z "$RGBA_SOURCE" ]; then
            echo 'ERROR: RGBA header is missing from the extracted source.'
            find "$C" -type f -iname '*rgba*' -print | sort || true
            exit 1
          fi
          echo "Using RGBA header: $RGBA_SOURCE"

          while IFS= read -r -d '' CPP; do
            if grep -Eq '#[[:space:]]*include[[:space:]]*[<"]RGBA\.h[>"]' "$CPP"; then
              CPP_DIR="$(dirname "$CPP")"
              cp -f "$RGBA_SOURCE" "$CPP_DIR/RGBA.h"
              echo "Resolved RGBA.h for: $CPP"
            fi
          done < <(find "$C" -type f \( -name '*.cpp' -o -name '*.c' \) -print0)

          RGBA_FOUND="$(find "$C" -type f -name 'RGBA.h' -print -quit || true)"
          [ -n "$RGBA_FOUND" ] || { echo 'ERROR: RGBA.h could not be created'; exit 1; }

          find "$PROJECT_DIR" -type f \( -name '*.gradle' -o -name '*.gradle.kts' \) -print0 |
            xargs -0 -r sed -i 's/jcenter()/mavenCentral()/g'

          echo '=== playerTabList headers ==='
          find "$C" -type f -name 'playerTabList.h' -print | sort
          echo '=== RGBA headers ==='
          find "$C" -type f -name 'RGBA.h' -print | sort

      - name: Build Release APK
        id: build
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          : > /tmp/dexin-build.log
          ./gradlew --no-daemon --stacktrace --warning-mode all clean 2>&1 | tee -a /tmp/dexin-build.log
          s=${PIPESTATUS[0]}
          if [ "$s" -eq 0 ]; then
            ./gradlew --no-daemon --stacktrace --warning-mode all :app:assembleRelease 2>&1 | tee -a /tmp/dexin-build.log
            s=${PIPESTATUS[0]}
          fi
          echo "GRADLE_EXIT=$s" | tee -a /tmp/dexin-build.log
          exit "$s"

      - name: Publish diagnostics
        if: always()
        shell: bash
        run: |
          {
            echo '## Dexin Mobile Build Diagnostics'
            echo
            echo "Build result: ${{ steps.build.outcome }}"
            echo
            echo '### Errors'
            echo '```text'
            grep -nEi 'error:|fatal error:|FAILED:|FAILURE:|Execution failed|What went wrong|Caused by:|Could not find|Could not resolve|undefined reference|duplicate class|GRADLE_EXIT=' /tmp/dexin-build.log | tail -n 200 || true
            echo '```'
            echo
            echo '### Last 300 lines'
            echo '```text'
            tail -n 300 /tmp/dexin-build.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DexinMobile-build-diagnostics
          path: /tmp/dexin-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop on build failure
        if: steps.build.outcome != 'success'
        run: exit 1

      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/release" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          [ -n "$APK" ] || { echo 'ERROR: assembleRelease succeeded but no APK was found'; exit 1; }
          cp "$APK" DexinMobile.apk
          ls -lh DexinMobile.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DexinMobile-APK
          path: DexinMobile.apk
          if-no-files-found: error
          retention-days: 14
