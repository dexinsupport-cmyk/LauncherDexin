name: Build SA-MP Launcher

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Reassemble Parts and Build Release APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check source parts
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking source parts..."
          for f in \
            sampstable_DexinMobile_updatedPart1.zip \
            sampstable_DexinMobile_updatedPart2.zip \
            sampstable_DexinMobile_updatedPart3.zip; do
            test -f "$f"
            ls -lh "$f"
          done

      - name: Validate and assemble source parts
        shell: bash
        run: |
          set -euo pipefail

          P1="sampstable_DexinMobile_updatedPart1.zip"
          P2="sampstable_DexinMobile_updatedPart2.zip"
          P3="sampstable_DexinMobile_updatedPart3.zip"

          echo "=========================================="
          echo "TESTING EACH PART AS A ZIP"
          echo "=========================================="

          PARTS_ARE_ZIPS=true
          for f in "$P1" "$P2" "$P3"; do
            echo "Testing: $f"
            if unzip -t "$f" >/tmp/zip-test.log 2>&1; then
              echo "OK: $f is a valid ZIP"
            else
              echo "NOT A STANDALONE ZIP: $f"
              PARTS_ARE_ZIPS=false
              cat /tmp/zip-test.log || true
            fi
          done

          rm -rf _source
          mkdir -p _source

          if [ "$PARTS_ARE_ZIPS" = true ]; then
            echo "=========================================="
            echo "PARTS ARE INDEPENDENT ZIP FILES"
            echo "Extracting Part1 + Part2 + Part3"
            echo "=========================================="

            unzip -q "$P1" -d _source
            unzip -q "$P2" -d _source
            unzip -q "$P3" -d _source

            echo "All three ZIP parts extracted successfully."
          else
            echo "=========================================="
            echo "TRYING RAW BINARY CONCATENATION"
            echo "=========================================="

            cat "$P1" "$P2" "$P3" > full_source.zip

            if unzip -t full_source.zip >/tmp/full-zip-test.log 2>&1; then
              echo "Concatenated archive is valid."
              unzip -q full_source.zip -d _source
            else
              echo "ERROR: The three uploaded parts are not a valid set."
              echo ""
              echo "Neither of these formats worked:"
              echo "1) Three independent ZIP archives"
              echo "2) One ZIP split into raw binary chunks"
              echo ""
              echo "The parts must be recreated from the same original ZIP."
              echo "Use binary split, for example: split -b 25M full_source.zip part"
              echo ""
              cat /tmp/full-zip-test.log || true
              exit 1
            fi
          fi

          echo "=========================================="
          echo "SEARCHING FOR GRADLE PROJECT"
          echo "=========================================="

          find _source -type f -name gradlew -print

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          GRADLEW="$(find _source -type f -name gradlew | head -n 1)"

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found after assembling source parts."
            echo "Extracted files:"
            find _source -maxdepth 3 -type f | head -100 || true
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Fix Linux line endings
        shell: bash
        run: |
          set -euo pipefail

          echo "Fixing CRLF line endings..."

          sed -i 's/\r$//' "$PROJECT_DIR/gradlew"

          find "$PROJECT_DIR" \
            -type f \
            \( \
              -name "*.sh" \
              -o -name "*.gradle" \
              -o -name "*.gradle.kts" \
              -o -name "*.properties" \
              -o -name "*.xml" \
              -o -name "*.cmake" \
              -o -name "CMakeLists.txt" \
            \) \
            -exec sed -i 's/\r$//' {} \;

          chmod +x "$PROJECT_DIR/gradlew"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK NDK and CMake
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.2.11394342" \
            "cmake;3.22.1"

      - name: Fix Linux case-sensitive headers (RakNet)
        shell: bash
        run: |
          set -euo pipefail

          CPP="$PROJECT_DIR/app/src/main/cpp"
          VENDOR="$CPP/samp/vendor"

          PLAYER="$(find "$CPP" -type f -iname "playertablist.h" | head -n 1 || true)"
          if [ -n "$PLAYER" ]; then
            DIR="$(dirname "$PLAYER")"
            cp -f "$PLAYER" "$DIR/playerTabList.h"
            echo "playerTabList.h fixed"
          fi

          RGBA="$(find "$CPP" -type f -iname "RGBA.h" | head -n 1 || true)"
          if [ -n "$RGBA" ]; then
            DIR="$(dirname "$RGBA")"
            cp -f "$RGBA" "$DIR/RGBA.h"
            echo "RGBA.h fixed"
          fi

          RAKNET_DIR="$(find "$VENDOR" -maxdepth 1 -type d \( -name "raknet" -o -name "RakNet" \) | head -n 1 || true)"

          if [ -z "$RAKNET_DIR" ]; then
            echo "ERROR: raknet/RakNet directory not found"
            ls -la "$VENDOR" || true
            exit 1
          fi

          if [ "$(basename "$RAKNET_DIR")" = "raknet" ]; then
            mv "$RAKNET_DIR" "$VENDOR/RakNet"
          fi

          find "$CPP" \
            -type f \
            \( -name "*.cpp" -o -name "*.c" -o -name "*.h" -o -name "*.hpp" \) \
            -print0 | \
            xargs -0 -r sed -i \
              -e 's|vendor/raknet/|vendor/RakNet/|g' \
              -e 's|vendor/RakNet/raknet/|vendor/RakNet/|g' \
              -e 's|"raknet/|"RakNet/|g' \
              -e "s|'raknet/|'RakNet/|g"

          EXPECTED="$VENDOR/RakNet/BitStream.h"

          if [ ! -f "$EXPECTED" ]; then
            BITSTREAM="$(find "$CPP" -type f -iname "BitStream.h" | head -n 1 || true)"
            if [ -n "$BITSTREAM" ]; then
              cp -f "$BITSTREAM" "$EXPECTED"
            else
              echo "ERROR: BitStream.h not found anywhere in source."
              find "$CPP" -type f \( -iname "*bitstream*" -o -iname "*raknet*" \) -print || true
              exit 1
            fi
          fi

          test -f "$EXPECTED"
          echo "RakNet BitStream.h OK"

      - name: Verify server configuration
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS="$PROJECT_DIR/app/src/main/cpp/samp/settings.cpp"

          if [ -f "$SETTINGS" ]; then
            echo "Checking server configuration..."
            grep -n -E "5\.57\.37\.215|7777" "$SETTINGS" || true
          else
            echo "WARNING: settings.cpp not found at expected path."
          fi

      - name: Create temporary keystore for CI
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE="$PROJECT_DIR/keystore_playmarket2.jks"

          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair \
              -alias my-key-alias \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -keystore "$KEYSTORE" \
              -storepass 'EDrp131211aA!!pass' \
              -keypass 'EDrp131211aA!!pass' \
              -dname "CN=SA-MP CI, OU=CI, O=SA-MP, L=City, ST=State, C=US" \
              -noprompt
          fi

          test -f "$KEYSTORE"

      - name: Patch build.gradle
        shell: bash
        run: |
          set -euo pipefail

          BG="$PROJECT_DIR/app/build.gradle"

          if [ -f "$BG" ]; then
            sed -i 's/nativeSymbolUploadEnabled true/nativeSymbolUploadEnabled false/g' "$BG" || true
          fi

      - name: Remove old build dirs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PROJECT_DIR/app/.cxx"
          rm -rf "$PROJECT_DIR/app/build"

      - name: Check Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --version

      - name: Gradle clean
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace clean

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "STARTING RELEASE APK BUILD"
          echo "=========================================="

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            :app:assembleRelease 2>&1 | tee /tmp/gradle-build.log

          echo "=========================================="
          echo "RELEASE BUILD FINISHED"
          echo "=========================================="

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/gradle-build.log
          retention-days: 7

      - name: Find generated APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          find "$PROJECT_DIR" -type f -name "*.apk" -print

          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/release"
          test -d "$APK_DIR"
          ls -lh "$APK_DIR"

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SA-MP-Launcher-Release-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
