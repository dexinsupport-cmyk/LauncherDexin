name: Build SA-MP Launcher

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Dexin Mobile APK
    runs-on: ubuntu-22.04

    steps:

      - name: "01 - Checkout"
        uses: actions/checkout@v4

      - name: "02 - Check source parts"
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CHECKING SOURCE PARTS"
          echo "=========================================="

          PART1="sampstable_github_readyPart1.zip"
          PART2="sampstable_github_readyPart2.zip"
          PART3="sampstable_github_readyPart3.zip"

          test -f "$PART1" || { echo "ERROR: $PART1 not found"; exit 1; }
          test -f "$PART2" || { echo "ERROR: $PART2 not found"; exit 1; }
          test -f "$PART3" || { echo "ERROR: $PART3 not found"; exit 1; }

          echo "Part 1: $PART1"
          echo "Part 2: $PART2"
          echo "Part 3: $PART3"

          ls -lh "$PART1" "$PART2" "$PART3"

          echo "All source parts found."

      - name: "03 - Reassemble source"
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "REASSEMBLING SOURCE"
          echo "=========================================="

          cat \
            "sampstable_github_readyPart1.zip" \
            "sampstable_github_readyPart2.zip" \
            "sampstable_github_readyPart3.zip" \
            > "sampstable_github_ready.zip"

          echo "Reassembled file:"
          ls -lh "sampstable_github_ready.zip"

          echo "Testing ZIP integrity..."

          if ! unzip -t "sampstable_github_ready.zip"; then
            echo ""
            echo "ERROR: Reassembled ZIP is invalid."
            echo "The three parts do not belong to the same binary-split archive."
            exit 1
          fi

          echo "ZIP INTEGRITY: OK"

      - name: "04 - Extract source"
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "EXTRACTING SOURCE"
          echo "=========================================="

          rm -rf "_source"
          mkdir -p "_source"

          unzip -q \
            "sampstable_github_ready.zip" \
            -d "_source"

          echo "Source extracted successfully."

          find "_source" \
            -type f \
            -name "gradlew" \
            -print

      - name: "05 - Locate Gradle project"
        shell: bash
        run: |
          set -euo pipefail

          GRADLEW="$(find "_source" -type f -name "gradlew" | head -n 1)"

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Gradle project found:"
          echo "$PROJECT_DIR"

      - name: "06 - Fix Linux line endings"
        shell: bash
        run: |
          set -euo pipefail

          echo "Fixing Linux line endings..."

          sed -i 's/\r$//' "$PROJECT_DIR/gradlew"

          find "$PROJECT_DIR" \
            -type f \
            \( \
              -name "*.sh" \
              -o -name "*.gradle" \
              -o -name "*.gradle.kts" \
              -o -name "*.properties" \
              -o -name "*.xml" \
              -o -name "*.cmake" \
              -o -name "CMakeLists.txt" \
            \) \
            -exec sed -i 's/\r$//' {} \;

          chmod +x "$PROJECT_DIR/gradlew"

          echo "Line endings fixed."

      - name: "07 - Setup JDK 17"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: "08 - Setup Android SDK"
        uses: android-actions/setup-android@v3

      - name: "09 - Install Android SDK components"
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.2.11394342" \
            "cmake;3.22.1"

          echo "Android components installed."

      - name: "10 - Check native source"
        shell: bash
        run: |
          set -euo pipefail

          CPP="$PROJECT_DIR/app/src/main/cpp"

          if [ ! -d "$CPP" ]; then
            echo "ERROR: Native source directory not found:"
            echo "$CPP"
            exit 1
          fi

          echo "Native source found:"
          echo "$CPP"

      - name: "11 - Fix playerTabList header"
        shell: bash
        run: |
          set -euo pipefail

          CPP="$PROJECT_DIR/app/src/main/cpp"

          PLAYER="$(find "$CPP" \
            -type f \
            -iname "playertablist.h" \
            | head -n 1 || true)"

          if [ -n "$PLAYER" ]; then

            DIR="$(dirname "$PLAYER")"

            cp -f \
              "$PLAYER" \
              "$DIR/playerTabList.h"

            echo "playerTabList.h fixed."

          else

            echo "playerTabList header not found."
            echo "Continuing..."

          fi

      - name: "12 - Fix RGBA header"
        shell: bash
        run: |
          set -euo pipefail

          CPP="$PROJECT_DIR/app/src/main/cpp"

          RGBA="$(find "$CPP" \
            -type f \
            -iname "RGBA.h" \
            | head -n 1 || true)"

          if [ -n "$RGBA" ]; then

            DIR="$(dirname "$RGBA")"

            cp -f \
              "$RGBA" \
              "$DIR/RGBA.h"

            echo "RGBA.h fixed."

          else

            echo "RGBA.h not found."
            echo "Continuing..."

          fi

      - name: "13 - Fix RakNet case sensitivity"
        shell: bash
        run: |
          set -euo pipefail

          CPP="$PROJECT_DIR/app/src/main/cpp"
          VENDOR="$CPP/samp/vendor"

          if [ ! -d "$VENDOR" ]; then
            echo "RakNet vendor directory not found."
            echo "Continuing..."
            exit 0
          fi

          if [ -d "$VENDOR/raknet" ] && [ ! -d "$VENDOR/RakNet" ]; then
            mv "$VENDOR/raknet" "$VENDOR/RakNet"
          fi

          if [ -d "$VENDOR/RakNet" ]; then

            echo "RakNet directory found."

            find "$CPP" \
              -type f \
              \( \
                -name "*.cpp" \
                -o -name "*.c" \
                -o -name "*.h" \
                -o -name "*.hpp" \
              \) \
              -print0 \
              | xargs -0 -r sed -i \
                -e 's|vendor/raknet/|vendor/RakNet/|g' \
                -e 's|"raknet/|"RakNet/|g' \
                -e "s|'raknet/|'RakNet/|g"

          else

            echo "RakNet directory not found."
            echo "Continuing..."

          fi

      - name: "14 - Verify server configuration"
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CHECKING DEXIN MOBILE SERVER"
          echo "=========================================="

          echo "Server:"
          echo "5.57.37.215:7777"

          grep -Rni \
            -E "5\.57\.37\.215|7777" \
            "$PROJECT_DIR/app/src/main" \
            2>/dev/null \
            | head -50 || true

          echo "Server check completed."

      - name: "15 - Patch build.gradle"
        shell: bash
        run: |
          set -euo pipefail

          BG="$PROJECT_DIR/app/build.gradle"

          if [ -f "$BG" ]; then

            sed -i \
              's/nativeSymbolUploadEnabled[[:space:]]\+true/nativeSymbolUploadEnabled false/g' \
              "$BG" || true

            echo "build.gradle patched."

          else

            echo "build.gradle not found."

          fi

      - name: "16 - Clean previous build"
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            "$PROJECT_DIR/app/.cxx" \
            "$PROJECT_DIR/app/build"

          echo "Previous build directories removed."

      - name: "17 - Check Gradle"
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --version

      - name: "18 - Build Release APK"
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DEXIN MOBILE APK BUILD START"
          echo "=========================================="

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            --build-cache \
            --parallel \
            :app:assembleRelease \
            2>&1 | tee /tmp/gradle-build.log

          echo "=========================================="
          echo "DEXIN MOBILE APK BUILD FINISHED"
          echo "=========================================="

      - name: "19 - Upload build log on failure"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DexinMobile-build-log
          path: /tmp/gradle-build.log
          retention-days: 7

      - name: "20 - Find APK"
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "SEARCHING FOR APK"
          echo "=========================================="

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/release"

          if [ ! -d "$APK_DIR" ]; then
            echo "ERROR: Release APK directory not found."
            exit 1
          fi

          ls -lh "$APK_DIR"

      - name: "21 - Upload Release APK"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DexinMobile-Release-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
