name: Build SA-MP Launcher

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    name: Build Dexin Mobile APK
    runs-on: ubuntu-22.04

    steps:
      - name: "01 - Checkout"
        uses: actions/checkout@v4

      - name: "02 - Detect source parts"
        shell: bash
        run: |
          set -euo pipefail
          echo "=== DETECTING SOURCE PARTS ==="
          find . -maxdepth 1 -type f -name '*Part*.zip' -printf '%f %s bytes\n' | sort || true
          pick_part() {
            local n="$1"
            find . -maxdepth 1 -type f \( \
              -name "sampstable_github_readyPart${n}.zip" -o \
              -name "sampstable_github_readyPart${n}-*.zip" -o \
              -name "sampstable_DexinMobile_updatedPart${n}.zip" -o \
              -name "sampstable_DexinMobile_updatedPart${n}-*.zip" \
            \) -print | sort | head -n 1 || true
          }
          P1="$(pick_part 1)"; P2="$(pick_part 2)"; P3="$(pick_part 3)"
          [ -n "$P1" ] || { echo "ERROR: Part 1 not found"; exit 1; }
          [ -n "$P2" ] || { echo "ERROR: Part 2 not found"; exit 1; }
          [ -n "$P3" ] || { echo "ERROR: Part 3 not found"; exit 1; }
          P1="${P1#./}"; P2="${P2#./}"; P3="${P3#./}"
          echo "Part 1: $P1"; echo "Part 2: $P2"; echo "Part 3: $P3"
          stat -c '%n = %s bytes' "$P1" "$P2" "$P3"
          echo "P1=$P1" >> "$GITHUB_ENV"
          echo "P2=$P2" >> "$GITHUB_ENV"
          echo "P3=$P3" >> "$GITHUB_ENV"

      - name: "03 - Reassemble and verify source ZIP"
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _source _repair
          mkdir -p _source _repair
          cat "$P1" "$P2" "$P3" > _repair/source.zip
          echo "Combined size: $(stat -c '%s' _repair/source.zip) bytes"
          if unzip -t _repair/source.zip > /tmp/unzip-test.log 2>&1; then
            echo "DIRECT CONCATENATION: PASSED"
            unzip -q _repair/source.zip -d _source
          else
            echo "DIRECT CONCATENATION: FAILED"
            cat /tmp/unzip-test.log || true
            echo "Trying zip -FF repair..."
            if zip -FF _repair/source.zip --out _repair/repaired.zip > /tmp/zip-repair.log 2>&1 && unzip -t _repair/repaired.zip > /tmp/repaired-test.log 2>&1; then
              echo "ZIP REPAIR: PASSED"
              unzip -q _repair/repaired.zip -d _source
            else
              echo "ZIP REPAIR FAILED"
              cat /tmp/zip-repair.log || true
              cat /tmp/repaired-test.log || true
              echo "Part headers:"
              xxd -l 16 "$P1" || true
              xxd -l 16 "$P2" || true
              xxd -l 16 "$P3" || true
              exit 1
            fi
          fi
          echo "=== SOURCE ASSEMBLY COMPLETE ==="

      - name: "04 - Locate Gradle project"
        shell: bash
        run: |
          set -euo pipefail
          GRADLEW="$(find _source -type f -name gradlew -print | head -n 1 || true)"
          [ -n "$GRADLEW" ] || { echo "ERROR: gradlew not found"; exit 1; }
          PROJECT_DIR="$(dirname "$GRADLEW")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Gradle project: $PROJECT_DIR"

      - name: "05 - Fix Linux line endings"
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/\r$//' "$PROJECT_DIR/gradlew"
          find "$PROJECT_DIR" -type f \( -name '*.sh' -o -name '*.gradle' -o -name '*.gradle.kts' -o -name '*.properties' -o -name '*.xml' -o -name '*.cmake' -o -name 'CMakeLists.txt' \) -exec sed -i 's/\r$//' {} \;
          chmod +x "$PROJECT_DIR/gradlew"

      - name: "06 - Set up JDK 17"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: "07 - Set up Android SDK"
        uses: android-actions/setup-android@v3

      - name: "08 - Install Android SDK components"
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.2.11394342" "cmake;3.22.1"

      - name: "09 - Create CI release keystore"
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE="$PROJECT_DIR/keystore_playmarket2.jks"
          STORE_PASS="DexinCI_2026_Release_Key!"
          KEY_ALIAS="my-key-alias"

          echo "=== RELEASE SIGNING KEYSTORE ==="
          echo "Expected keystore: $KEYSTORE"

          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -keystore "$KEYSTORE" \
              -storepass "$STORE_PASS" \
              -keypass "$STORE_PASS" \
              -dname "CN=Dexin Mobile, OU=Release, O=Dexin Mobile, L=Dexin, ST=NA, C=US" \
              -noprompt
            echo "CI keystore created."
          else
            echo "CI keystore already exists."
          fi

          test -f "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASS" -alias "$KEY_ALIAS" >/dev/null
          echo "Release keystore verified successfully."

      - name: "10 - Verify native source"
        shell: bash
        run: |
          set -euo pipefail
          CPP="$PROJECT_DIR/app/src/main/cpp"
          [ -d "$CPP" ] || { echo "ERROR: Native source not found: $CPP"; exit 1; }

      - name: "11 - Fix Linux case-sensitive headers"
        shell: bash
        run: |
          set -euo pipefail
          CPP="$PROJECT_DIR/app/src/main/cpp"
          PLAYER="$(find "$CPP" -type f -iname 'playertablist.h' -print | head -n 1 || true)"
          if [ -n "$PLAYER" ]; then cp -f "$PLAYER" "$(dirname "$PLAYER")/playerTabList.h"; fi
          RGBA="$(find "$CPP" -type f -iname 'RGBA.h' -print | head -n 1 || true)"
          if [ -n "$RGBA" ]; then cp -f "$RGBA" "$(dirname "$RGBA")/RGBA.h"; fi

      - name: "12 - Fix RakNet path and all RakNet headers"
        shell: bash
        run: |
          set -euo pipefail
          CPP="$PROJECT_DIR/app/src/main/cpp"
          VENDOR="$CPP/samp/vendor"
          [ -d "$VENDOR" ] || { echo "ERROR: vendor directory not found: $VENDOR"; exit 1; }

          echo "=== RAKNET DIRECTORY DISCOVERY ==="
          find "$VENDOR" -maxdepth 2 -type f \( -iname 'BitStream.h' -o -iname 'RakClientInterface.h' -o -iname 'RakClient.h' \) -print || true

          RAKNET_DIR="$(find "$VENDOR" -maxdepth 1 -type d -iname 'raknet' -print | head -n 1 || true)"
          if [ -z "$RAKNET_DIR" ]; then
            echo "ERROR: No raknet directory exists under $VENDOR"
            find "$VENDOR" -maxdepth 2 -print | head -200
            exit 1
          fi

          echo "Using RakNet directory: $RAKNET_DIR"

          find "$CPP" -type f \( -name '*.cpp' -o -name '*.c' -o -name '*.h' -o -name '*.hpp' \) -print0 | xargs -0 -r sed -i \
            -e 's|vendor/RakNet/|vendor/raknet/|g' \
            -e 's|"RakNet/|"raknet/|g' \
            -e "s|'RakNet/|'raknet/|g" \
            -e 's|\.\./vendor/RakNet/|../vendor/raknet/|g'

          for WANT in BitStream.h RakClientInterface.h RakClient.h; do
            FOUND="$(find "$RAKNET_DIR" -maxdepth 1 -type f -iname "$WANT" -print | head -n 1 || true)"
            if [ -n "$FOUND" ]; then
              BASE="$(basename "$FOUND")"
              if [ "$BASE" != "$WANT" ]; then
                cp -f "$FOUND" "$RAKNET_DIR/$WANT"
              fi
              echo "OK: $WANT"
            else
              echo "WARNING: $WANT not found"
            fi
          done

          echo "=== FINAL RAKNET FILES ==="
          find "$RAKNET_DIR" -maxdepth 1 -type f | sort | head -100

      - name: "13 - Verify RakNet headers used by compiler"
        shell: bash
        run: |
          set -euo pipefail
          CPP="$PROJECT_DIR/app/src/main/cpp"
          RAKNET="$(find "$CPP/samp/vendor" -maxdepth 1 -type d -iname 'raknet' -print | head -n 1 || true)"
          [ -n "$RAKNET" ] || { echo "ERROR: RakNet directory missing"; exit 1; }
          test -f "$RAKNET/BitStream.h" || { echo "ERROR: BitStream.h missing"; exit 1; }
          test -f "$RAKNET/RakClientInterface.h" || { echo "ERROR: RakClientInterface.h missing"; exit 1; }
          echo "OK: BitStream.h"
          echo "OK: RakClientInterface.h"
          grep -Rni --include='*.cpp' --include='*.h' --include='*.hpp' 'vendor/RakNet/\|vendor/raknet/' "$CPP" | head -100 || true

      - name: "14 - Verify Dexin Mobile server target"
        shell: bash
        run: |
          set -euo pipefail
          echo "Dexin Mobile server target: 5.57.37.215:7777"
          grep -Rni -E '5\.57\.37\.215|7777' "$PROJECT_DIR/app/src/main" 2>/dev/null | head -50 || true

      - name: "15 - Patch optional build settings"
        shell: bash
        run: |
          set -euo pipefail
          BG="$PROJECT_DIR/app/build.gradle"
          if [ -f "$BG" ]; then
            sed -i 's/nativeSymbolUploadEnabled[[:space:]]\+true/nativeSymbolUploadEnabled false/g' "$BG" || true
          fi

      - name: "16 - Verify signing configuration"
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$PROJECT_DIR/keystore_playmarket2.jks"
          test -f "$KEYSTORE"
          echo "Signing keystore exists: $KEYSTORE"
          echo "Relevant build.gradle signing lines:"
          grep -n -E 'signingConfigs|keystore_playmarket2|storeFile|keyAlias' "$PROJECT_DIR/app/build.gradle" || true

      - name: "17 - Clean previous build"
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PROJECT_DIR/app/.cxx" "$PROJECT_DIR/app/build"

      - name: "18 - Gradle version"
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --version

      - name: "19 - Gradle clean"
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace clean

      - name: "20 - Build Release APK"
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          echo "=== DEXIN MOBILE APK BUILD START ==="
          ./gradlew --no-daemon --stacktrace --warning-mode all --build-cache :app:assembleRelease 2>&1 | tee /tmp/gradle-build.log
          echo "=== DEXIN MOBILE APK BUILD FINISHED ==="

      - name: "21 - Upload build log on failure"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DexinMobile-build-log
          path: /tmp/gradle-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: "22 - Find generated APK"
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          find "$PROJECT_DIR" -type f -name '*.apk' -print
          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/release"
          test -d "$APK_DIR"
          ls -lh "$APK_DIR"

      - name: "23 - Upload Release APK"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DexinMobile-Release-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
