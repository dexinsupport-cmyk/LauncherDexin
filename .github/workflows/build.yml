name: Build SA-MP Launcher

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Reassemble 3 Parts and Build APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check 3 source parts
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking 3 split source parts..."
          test -f "sampstable_github_readyPart1.zip"
          test -f "sampstable_github_readyPart2.zip"
          test -f "sampstable_github_readyPart3.zip"
          echo "Part 1: $(stat -c%s sampstable_github_readyPart1.zip) bytes"
          echo "Part 2: $(stat -c%s sampstable_github_readyPart2.zip) bytes"
          echo "Part 3: $(stat -c%s sampstable_github_readyPart3.zip) bytes"
          echo "All 3 parts found."

      - name: Reassemble original ZIP
        shell: bash
        run: |
          set -euo pipefail
          cat sampstable_github_readyPart1.zip sampstable_github_readyPart2.zip sampstable_github_readyPart3.zip > sampstable_github_ready.zip
          echo "Reassembled size: $(stat -c%s sampstable_github_ready.zip) bytes"
          unzip -t sampstable_github_ready.zip
          echo "ZIP integrity check passed."

      - name: Extract complete source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _source
          mkdir -p _source
          unzip -q sampstable_github_ready.zip -d _source
          test -d "_source/sampstable"
          test -f "_source/sampstable/gradlew"
          test -f "_source/sampstable/settings.gradle"
          test -f "_source/sampstable/app/build.gradle"
          echo "Complete source extracted."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.2.11394342" "cmake;3.22.1"
          test -d "$ANDROID_HOME/ndk/26.2.11394342"

      - name: Prepare Gradle project
        working-directory: _source/sampstable
        shell: bash
        run: |
          set -euo pipefail

          # Normalize Windows line endings in Gradle wrapper.
          sed -i 's/\r$//' ./gradlew
          sed -i 's/\r$//' ./gradle/wrapper/gradle-wrapper.properties
          chmod +x ./gradlew
          sed -i 's#gradle-[0-9.]*-bin.zip#gradle-8.2.1-bin.zip#' gradle/wrapper/gradle-wrapper.properties

          # The source was developed on a case-insensitive filesystem.
          # Linux/GitHub Actions is case-sensitive. gui.h includes
          # playerTabList.h while the archive contains playertablist.h.
          WIDGET_DIR="app/src/main/cpp/samp/gui/samp_widgets"
          if [ -f "$WIDGET_DIR/playertablist.h" ] && [ ! -f "$WIDGET_DIR/playerTabList.h" ]; then
            cp "$WIDGET_DIR/playertablist.h" "$WIDGET_DIR/playerTabList.h"
            echo "Created Linux compatibility alias: playerTabList.h"
          fi

          test -f "$WIDGET_DIR/playerTabList.h"

          if [ ! -f "keystore_playmarket2.jks" ]; then
            keytool -genkeypair -v \
              -keystore "keystore_playmarket2.jks" \
              -storepass 'EDrp131211aA!!pass' \
              -keypass 'EDrp131211aA!!pass' \
              -alias 'my-key-alias' \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=SA-MP Launcher, OU=CI, O=SA-MP, L=Unknown, ST=Unknown, C=US"
          fi

      - name: Build Release APK
        working-directory: _source/sampstable
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace --warning-mode all :app:assembleRelease

      - name: Find generated APK
        shell: bash
        run: |
          set -euo pipefail
          echo "Generated APK files:"
          find _source/sampstable/app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SA-MP-Launcher-Release-APK
          path: _source/sampstable/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
