name: Build Dexin Mobile APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble source parts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t PARTS < <(
            find . -maxdepth 3 -type f -name '*.zip' -print0 |
            while IFS= read -r -d '' f; do
              b="$(basename "$f")"
              if [[ "$b" =~ Part([0-9]+)(-[^/]*)?\.zip$ ]]; then
                printf '%d\t%s\n' "${BASH_REMATCH[1]}" "$f"
              fi
            done | sort -n -k1,1 | cut -f2-
          )
          [ "${#PARTS[@]}" -gt 0 ] || { echo 'ERROR: no Part*.zip files found'; exit 1; }
          expected=1
          for p in "${PARTS[@]}"; do
            b="$(basename "$p")"
            [[ "$b" =~ Part([0-9]+) ]] || { echo "ERROR: invalid part $b"; exit 1; }
            [ "${BASH_REMATCH[1]}" -eq "$expected" ] || { echo "ERROR: expected Part${expected}, found $b"; exit 1; }
            expected=$((expected+1))
          done
          echo "Parts: ${#PARTS[@]}"
          rm -f source.zip
          cat "${PARTS[@]}" > source.zip
          unzip -t source.zip
          rm -rf _source
          mkdir _source
          unzip -q source.zip -d _source

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail
          G="$(find _source -type f -name gradlew -print -quit)"
          [ -n "$G" ] || { echo 'ERROR: gradlew not found after extraction'; exit 1; }
          D="$(dirname "$G")"
          echo "PROJECT_DIR=$D" >> "$GITHUB_ENV"
          sed -i 's/\r$//' "$D/gradlew"
          chmod +x "$D/gradlew"
          echo "PROJECT_DIR=$D"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0' 'ndk;26.2.11394342' 'cmake;3.22.1'

      - name: Fix Linux case sensitivity and CLink redefinition
        shell: bash
        run: |
          set -euo pipefail
          C="$PROJECT_DIR/app/src/main/cpp"
          [ -d "$C" ] || { echo "ERROR: native source directory missing: $C"; exit 1; }

          # Fix the known Linux case-sensitive header names without using an
          # embedded Python heredoc. This keeps the workflow itself POSIX-safe.
          for src in $(find "$C" -type f -iname 'playertablist.h' -print); do
            dst="$(dirname "$src")/playerTabList.h"
            [ -e "$dst" ] || cp -f "$src" "$dst"
          done
          for src in $(find "$C" -type f -iname 'rgba.h' -print); do
            dst="$(dirname "$src")/RGBA.h"
            [ -e "$dst" ] || cp -f "$src" "$dst"
          done

          # The previous workflow failed before compilation because its
          # heredoc was malformed. Use a direct, deterministic guard here.
          while IFS= read -r -d '' p; do
            if ! grep -qE '^#pragma once[[:space:]]*$' "$p"; then
              tmp="${p}.tmp"
              { echo '#pragma once'; cat "$p"; } > "$tmp"
              mv "$tmp" "$p"
              echo "added include guard: $p"
            else
              echo "include guard already present: $p"
            fi
          done < <(find "$C" -type f -path '*/armhook/link.h' -print0)

          echo '=== armhook/link.h ==='
          find "$C" -type f -path '*/armhook/link.h' -print -exec sed -n '1,35p' {} \;
          echo '=== required headers ==='
          find "$C" -type f \( -iname 'RGBA.h' -o -iname 'playerTabList.h' \) -print | sort

      - name: Build Release APK
        id: build
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          : > /tmp/dexin-build.log
          ./gradlew --no-daemon --stacktrace --warning-mode all clean 2>&1 | tee -a /tmp/dexin-build.log
          s=${PIPESTATUS[0]}
          if [ "$s" -eq 0 ]; then
            ./gradlew --no-daemon --stacktrace --warning-mode all :app:assembleRelease 2>&1 | tee -a /tmp/dexin-build.log
            s=${PIPESTATUS[0]}
          fi
          echo "GRADLE_EXIT=$s" | tee -a /tmp/dexin-build.log
          exit "$s"

      - name: Publish diagnostics
        if: always()
        shell: bash
        run: |
          {
            echo '## Dexin Mobile Build Diagnostics'
            echo
            echo "Build result: ${{ steps.build.outcome }}"
            echo
            echo '### Errors'
            echo '```text'
            grep -nEi 'error:|fatal error:|FAILED:|FAILURE:|Execution failed|What went wrong|Caused by:|Could not find|Could not resolve|undefined reference|duplicate class|GRADLE_EXIT=' /tmp/dexin-build.log | tail -n 200 || true
            echo '```'
            echo
            echo '### Last 300 lines'
            echo '```text'
            tail -n 300 /tmp/dexin-build.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DexinMobile-build-diagnostics
          path: /tmp/dexin-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop on build failure
        if: steps.build.outcome != 'success'
        run: exit 1

      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/release" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          [ -n "$APK" ] || { echo 'ERROR: assembleRelease succeeded but no APK was found'; exit 1; }
          cp "$APK" DexinMobile.apk
          ls -lh DexinMobile.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DexinMobile-APK
          path: DexinMobile.apk
          if-no-files-found: error
          retention-days: 14
