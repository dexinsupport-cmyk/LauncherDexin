name: Build Dexin Mobile APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble source parts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t PARTS < <(find . -maxdepth 3 -type f -name '*.zip' -print0 | while IFS= read -r -d '' f; do b="$(basename "$f")"; if [[ "$b" =~ Part([0-9]+)(-[^/]*)?\.zip$ ]]; then printf '%d\t%s\n' "${BASH_REMATCH[1]}" "$f"; fi; done | sort -n -k1,1 | cut -f2-)
          [ "${#PARTS[@]}" -gt 0 ] || { echo 'ERROR: no Part*.zip files found'; exit 1; }
          expected=1
          for p in "${PARTS[@]}"; do b="$(basename "$p")"; [[ "$b" =~ Part([0-9]+) ]] || exit 1; [ "${BASH_REMATCH[1]}" -eq "$expected" ] || { echo "ERROR: expected Part${expected}, found $b"; exit 1; }; expected=$((expected+1)); done
          rm -f source.zip
          cat "${PARTS[@]}" > source.zip
          unzip -t source.zip
          rm -rf _source && mkdir -p _source
          unzip -q source.zip -d _source

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail
          G="$(find _source -type f -name gradlew -print -quit)"
          [ -n "$G" ] || { echo 'ERROR: gradlew not found after extraction'; exit 1; }
          D="$(cd "$(dirname "$G")" && pwd)"
          echo "PROJECT_DIR=$D" >> "$GITHUB_ENV"
          sed -i 's/\r$//' "$D/gradlew"
          chmod +x "$D/gradlew"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0' 'ndk;26.2.11394342' 'cmake;3.22.1'

      - name: Fix Linux native source case issues
        shell: bash
        run: |
          set -euo pipefail
          C="$PROJECT_DIR/app/src/main/cpp"
          [ -d "$C" ] || exit 1

          RGBA_SOURCE="$(find "$C" -type f -iname 'rgba.h' -print -quit || true)"
          [ -n "$RGBA_SOURCE" ] || { echo 'ERROR: rgba.h not found'; exit 1; }
          RGBA_DIR="$(dirname "$RGBA_SOURCE")"
          cp -f "$RGBA_SOURCE" "$RGBA_DIR/RGBA.h"
          # rgba.cpp includes RGBA.h, so ensure the exact-case header exists beside it.
          while IFS= read -r -d '' CPP; do cp -f "$RGBA_SOURCE" "$(dirname "$CPP")/RGBA.h"; done < <(find "$C" -type f -iname 'rgba.cpp' -print0)

          PLAYER_SOURCE="$(find "$C" -type f -iname 'playertablist.h' -print -quit || true)"
          [ -n "$PLAYER_SOURCE" ] || { echo 'ERROR: playerTabList.h not found'; exit 1; }
          while IFS= read -r -d '' GUI; do D="$(dirname "$GUI")"; mkdir -p "$D/samp_widgets"; cp -f "$PLAYER_SOURCE" "$D/samp_widgets/playerTabList.h"; done < <(find "$C" -type f -path '*/gui/gui.h' -print0)
          while IFS= read -r -d '' CPP; do D="$(dirname "$CPP")"; cp -f "$PLAYER_SOURCE" "$D/playerTabList.h" 2>/dev/null || true; done < <(find "$C" -type f -iname 'playertablist.cpp' -print0)

          find "$C" -type f \( -name '*.cpp' -o -name '*.c' -o -name '*.h' -o -name '*.hpp' \) -print0 | xargs -0 -r sed -i -e 's|vendor/RakNet/|vendor/raknet/|g' -e 's|../vendor/RakNet/|../vendor/raknet/|g' -e 's|../../vendor/RakNet/|../../vendor/raknet/|g' -e 's|"RakNet/|"raknet/|g' -e 's|<RakNet/|<raknet/|g'

          while IFS= read -r -d '' P; do
            if ! grep -qE '^#pragma once[[:space:]]*$' "$P"; then T="${P}.tmp"; { printf '%s\n' '#pragma once'; cat "$P"; } > "$T"; mv "$T" "$P"; fi
          done < <(find "$C" -type f -path '*/armhook/link.h' -print0)

      - name: Prepare CI Gradle overrides
        shell: bash
        run: |
          cat > /tmp/dexin-ci.gradle <<'GRADLE'
allprojects { project ->
    project.afterEvaluate {
        def android = project.extensions.findByName('android')
        if (android != null && android.hasProperty('packagingOptions')) {
            android.packagingOptions.jniLibs.pickFirst('lib/arm64-v8a/libshadowhook.so')
            android.packagingOptions.jniLibs.pickFirst('lib/armeabi-v7a/libshadowhook.so')
        }
    }
}
GRADLE

      - name: Build Release APK
        id: build
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace --warning-mode all -I /tmp/dexin-ci.gradle clean 2>&1 | tee /tmp/dexin-build.log
          ./gradlew --no-daemon --stacktrace --warning-mode all -I /tmp/dexin-ci.gradle :app:assembleRelease 2>&1 | tee -a /tmp/dexin-build.log

      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/release" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          [ -n "$APK" ] || { echo 'ERROR: Release build succeeded but APK was not found'; exit 1; }
          cp "$APK" DexinMobile.apk
          ls -lh DexinMobile.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DexinMobile-APK
          path: DexinMobile.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DexinMobile-build-log
          path: /tmp/dexin-build.log
          if-no-files-found: warn
          retention-days: 14
