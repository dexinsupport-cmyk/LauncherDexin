name: Build SA-MP Launcher

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    name: Fast Build Release APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check source parts
        shell: bash
        run: |
          set -euo pipefail
          for f in sampstable_DexinMobile_updatedPart1.zip sampstable_DexinMobile_updatedPart2.zip sampstable_DexinMobile_updatedPart3.zip; do
            test -f "$f"
            echo "OK: $f"
            ls -lh "$f"
          done

      # The three uploaded files are treated as independent ZIP archives.
      # This avoids the very slow zip -FF / 7z recovery on GitHub runners.
      - name: Verify and extract parts quickly
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _source _parts
          mkdir -p _source _parts/1 _parts/2 _parts/3

          unzip -t sampstable_DexinMobile_updatedPart1.zip >/tmp/p1.log
          unzip -t sampstable_DexinMobile_updatedPart2.zip >/tmp/p2.log
          unzip -t sampstable_DexinMobile_updatedPart3.zip >/tmp/p3.log

          unzip -q sampstable_DexinMobile_updatedPart1.zip -d _parts/1
          unzip -q sampstable_DexinMobile_updatedPart2.zip -d _parts/2
          unzip -q sampstable_DexinMobile_updatedPart3.zip -d _parts/3

          cp -a _parts/1/. _source/
          cp -a _parts/2/. _source/
          cp -a _parts/3/. _source/

          echo "Source assembled from 3 valid ZIP parts."
          find _source -type f -name gradlew -print

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail
          GRADLEW="$(find _source -type f -name gradlew | head -n 1)"
          test -n "$GRADLEW"
          PROJECT_DIR="$(dirname "$GRADLEW")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Fix Linux line endings
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/\r$//' "$PROJECT_DIR/gradlew"
          find "$PROJECT_DIR" -type f \( -name '*.sh' -o -name '*.gradle' -o -name '*.gradle.kts' -o -name '*.properties' -o -name '*.xml' -o -name '*.cmake' -o -name 'CMakeLists.txt' \) -exec sed -i 's/\r$//' {} \;
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install only missing Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          INSTALLED="$(sdkmanager --list_installed 2>/dev/null || true)"
          NEED=()

          echo "$INSTALLED" | grep -q 'platform-tools' || NEED+=("platform-tools")
          echo "$INSTALLED" | grep -q 'platforms;android-34' || NEED+=("platforms;android-34")
          echo "$INSTALLED" | grep -q 'build-tools;34.0.0' || NEED+=("build-tools;34.0.0")
          echo "$INSTALLED" | grep -q 'ndk;26.2.11394342' || NEED+=("ndk;26.2.11394342")
          echo "$INSTALLED" | grep -q 'cmake;3.22.1' || NEED+=("cmake;3.22.1")

          if [ "${#NEED[@]}" -gt 0 ]; then
            echo "Installing missing components: ${NEED[*]}"
            sdkmanager "${NEED[@]}"
          else
            echo "All required Android components already exist on the runner."
          fi

      - name: Fix Linux case-sensitive native files
        shell: bash
        run: |
          set -euo pipefail
          CPP="$PROJECT_DIR/app/src/main/cpp"
          VENDOR="$CPP/samp/vendor"
          test -d "$CPP"
          test -d "$VENDOR"

          PLAYER="$(find "$CPP" -type f -iname 'playertablist.h' | head -n 1 || true)"
          if [ -n "$PLAYER" ]; then
            cp -f "$PLAYER" "$(dirname "$PLAYER")/playerTabList.h"
          fi

          RGBA="$(find "$CPP" -type f -iname 'RGBA.h' | head -n 1 || true)"
          if [ -n "$RGBA" ]; then
            cp -f "$RGBA" "$(dirname "$RGBA")/RGBA.h"
          fi

          if [ -d "$VENDOR/raknet" ] && [ ! -d "$VENDOR/RakNet" ]; then
            mv "$VENDOR/raknet" "$VENDOR/RakNet"
          fi
          test -d "$VENDOR/RakNet"

          find "$CPP" -type f \( -name '*.cpp' -o -name '*.c' -o -name '*.h' -o -name '*.hpp' \) -print0 | \
            xargs -0 -r sed -i \
              -e 's|vendor/raknet/|vendor/RakNet/|g' \
              -e 's|vendor/RakNet/raknet/|vendor/RakNet/|g' \
              -e 's|"raknet/|"RakNet/|g' \
              -e "s|'raknet/|'RakNet/|g"

          if [ ! -f "$VENDOR/RakNet/BitStream.h" ]; then
            BITSTREAM="$(find "$CPP" -type f -iname 'BitStream.h' | head -n 1 || true)"
            test -n "$BITSTREAM"
            cp -f "$BITSTREAM" "$VENDOR/RakNet/BitStream.h"
          fi
          test -f "$VENDOR/RakNet/BitStream.h"

      - name: Verify server and DexinMobile configuration
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS="$PROJECT_DIR/app/src/main/cpp/samp/settings.cpp"
          if [ -f "$SETTINGS" ]; then
            echo "Server configuration:"
            grep -n -E '5\.57\.37\.215|7777' "$SETTINGS" || true
          fi

          echo "Checking DexinMobile path references..."
          grep -Rni --include='*.cpp' --include='*.h' --include='*.java' --include='*.kt' \
            -E 'DexinMobile|/storage/emulated/0' "$PROJECT_DIR/app/src/main" 2>/dev/null | head -50 || true

      - name: Create temporary keystore for CI
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$PROJECT_DIR/keystore_playmarket2.jks"
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair \
              -alias my-key-alias \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -keystore "$KEYSTORE" \
              -storepass 'EDrp131211aA!!pass' \
              -keypass 'EDrp131211aA!!pass' \
              -dname 'CN=SA-MP CI, OU=CI, O=SA-MP, L=City, ST=State, C=US' \
              -noprompt
          fi
          test -f "$KEYSTORE"

      - name: Patch build.gradle
        shell: bash
        run: |
          set -euo pipefail
          BG="$PROJECT_DIR/app/build.gradle"
          if [ -f "$BG" ]; then
            sed -i 's/nativeSymbolUploadEnabled true/nativeSymbolUploadEnabled false/g' "$BG" || true
          fi

      - name: Check Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --version

      # Do not run clean: it wastes time and deletes useful Gradle/CMake caches.
      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew \
            --no-daemon \
            --stacktrace \
            --build-cache \
            --parallel \
            :app:assembleRelease 2>&1 | tee /tmp/gradle-build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/gradle-build.log
          retention-days: 3

      - name: Find generated APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          find "$PROJECT_DIR" -type f -name '*.apk' -print
          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/release"
          test -d "$APK_DIR"
          ls -lh "$APK_DIR"

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SA-MP-Launcher-Release-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
