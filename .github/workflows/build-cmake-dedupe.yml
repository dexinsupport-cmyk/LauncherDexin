name: Build Dexin Mobile APK - CMake Final

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_PLATFORM: "android-34"
  ANDROID_BUILD_TOOLS: "34.0.0"
  ANDROID_NDK: "26.2.11394342"
  CMAKE_VERSION: "3.22.1"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble source parts
        shell: bash
        run: |
          set -euo pipefail
          parts=()
          for n in 1 2 3; do
            f="$(find . -maxdepth 2 -type f -name "DexinMobile_Verify_SourcePart${n}.zip" -print -quit)"
            [ -n "$f" ] || { echo "ERROR: SourcePart${n}.zip not found"; exit 1; }
            parts+=("$f")
          done
          cat "${parts[@]}" > source.zip
          unzip -t source.zip
          rm -rf _source
          mkdir _source
          unzip -q source.zip -d _source

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail
          G="$(find _source -type f -name gradlew -print -quit)"
          [ -n "$G" ] || { echo "ERROR: gradlew not found"; exit 1; }
          D="$(cd "$(dirname "$G")" && pwd)"
          echo "PROJECT_DIR=$D" >> "$GITHUB_ENV"
          sed -i 's/\r$//' "$D/gradlew"
          chmod +x "$D/gradlew"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install native tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}" "ndk;${ANDROID_NDK}" "cmake;${CMAKE_VERSION}"

      - name: Fix native tree before CMake
        shell: bash
        run: |
          set -euo pipefail
          C="$PROJECT_DIR/app/src/main/cpp"
          S="$C/samp"
          V="$S/vendor"
          test -d "$S" && test -d "$V"
          mapfile -t dirs < <(find "$V" -mindepth 1 -maxdepth 1 -type d -iname 'raknet' -print | sort)
          [ "${#dirs[@]}" -gt 0 ] || { echo "ERROR: no RakNet directory found"; exit 1; }
          chosen=""; best=0
          for d in "${dirs[@]}"; do
            n="$(find "$d" -type f \( -name '*.cpp' -o -name '*.cc' -o -name '*.cxx' \) | wc -l)"
            if [ "$n" -gt "$best" ]; then best="$n"; chosen="$d"; fi
          done
          rm -rf "$V/raknet"
          mkdir -p "$V/raknet"
          cp -a "$chosen"/. "$V/raknet/"
          for d in "${dirs[@]}"; do
            [ "$d" = "$chosen" ] || {
              while IFS= read -r -d '' h; do
                rel="${h#"$d"/}"; dst="$V/raknet/$rel"; mkdir -p "$(dirname "$dst")"; cp -n "$h" "$dst" || true
              done < <(find "$d" -type f \( -name '*.h' -o -name '*.hpp' -o -name '*.inl' \) -print0)
            }
          done
          for d in "${dirs[@]}"; do [ "$d" = "$V/raknet" ] || rm -rf "$d"; done
          find "$S" -type f \( -name 'CMakeLists.txt' -o -name '*.cmake' -o -name '*.h' -o -name '*.hpp' -o -name '*.inl' -o -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.cxx' \) -print0 | xargs -0 -r sed -i 's#vendor/RakNet/#vendor/raknet/#g; s#vendor/RakNet#vendor/raknet#g'
          mkdir -p "$S/gui/samp_widgets" "$S/game"
          p="$(find "$C" -type f -iname 'playerTabList.h' -print -quit || true)"; [ -z "$p" ] || cp -f "$p" "$S/gui/samp_widgets/playerTabList.h"
          r="$(find "$C" -type f -iname 'RGBA.h' -print -quit || true)"; [ -z "$r" ] || cp -f "$r" "$S/game/RGBA.h"

      - name: Clean native build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PROJECT_DIR/app/.cxx" "$PROJECT_DIR/app/build"

      - name: Prepare debug keystore for test build
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$PROJECT_DIR/keystore_playmarket2.jks"
          mkdir -p "$(dirname "$KEYSTORE")"
          rm -f "$KEYSTORE"
          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE" \
            -storetype JKS \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass android >/dev/null
          echo "CI_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Override signing config for CI test build
        shell: bash
        run: |
          set -euo pipefail
          cat > "$PROJECT_DIR/signing-ci.gradle" <<'GRADLE'
allprojects { project ->
    project.afterEvaluate {
        def androidExt = project.extensions.findByName("android")
        if (androidExt != null) {
            def ks = new File(project.rootDir, "keystore_playmarket2.jks")
            def debugConfig = androidExt.signingConfigs.findByName("debug")
            if (debugConfig != null) {
                debugConfig.storeFile = ks
                debugConfig.storePassword = "android"
                debugConfig.keyAlias = "androiddebugkey"
                debugConfig.keyPassword = "android"
            }
        }
    }
}
GRADLE
          test -f "$PROJECT_DIR/keystore_playmarket2.jks"
          test -s "$PROJECT_DIR/signing-ci.gradle"

      - name: Build Debug APK for testing
        id: build
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          : > /tmp/gradle.log
          ./gradlew --no-daemon --stacktrace -I signing-ci.gradle :app:assembleDebug 2>&1 | tee -a /tmp/gradle.log
          s=${PIPESTATUS[0]}
          echo "GRADLE_EXIT=$s" >> /tmp/gradle.log
          exit "$s"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DexinMobile-debug-diagnostics
          path: /tmp/gradle.log
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DexinMobile-TEST-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
