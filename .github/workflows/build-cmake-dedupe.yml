name: Build Dexin Mobile APK - CMake Final

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble source parts
        shell: bash
        run: |
          set -euo pipefail
          parts=()
          for n in 1 2 3; do
            f="$(find . -maxdepth 2 -type f -name "DexinMobile_Verify_SourcePart${n}.zip" -print -quit)"
            [ -n "$f" ] || { echo "ERROR: SourcePart${n}.zip not found"; exit 1; }
            parts+=("$f")
          done
          cat "${parts[@]}" > source.zip
          unzip -t source.zip
          rm -rf _source
          mkdir _source
          unzip -q source.zip -d _source

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail
          G="$(find _source -type f -name gradlew -print -quit)"
          [ -n "$G" ] || { echo "ERROR: gradlew not found"; exit 1; }
          D="$(cd "$(dirname "$G")" && pwd)"
          echo "PROJECT_DIR=$D" >> "$GITHUB_ENV"
          sed -i 's/\r$//' "$D/gradlew"
          chmod +x "$D/gradlew"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install native tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.2.11394342" "cmake;3.22.1"

      - name: Fix native tree before CMake
        shell: bash
        run: |
          set -euo pipefail
          C="$PROJECT_DIR/app/src/main/cpp"
          S="$C/samp"
          R="$S/vendor/raknet"
          U="$S/vendor/RakNet"
          test -d "$S" || { echo "ERROR: samp directory missing"; exit 1; }
          test -d "$R" || { echo "ERROR: canonical vendor/raknet missing"; exit 1; }

          # The failing build proved that the archive contains two complete
          # RakNet trees: vendor/RakNet and vendor/raknet. Both were compiled,
          # producing identical symbols. Do not mirror implementation files.
          # Remove the duplicate tree and rewrite only path references to the
          # canonical lower-case tree. This happens BEFORE CMake configures.
          rm -rf "$U"
          find "$S" -type f \( -name 'CMakeLists.txt' -o -name '*.cmake' -o -name '*.h' -o -name '*.hpp' -o -name '*.inl' -o -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.cxx' \) -print0 \
            | xargs -0 -r sed -i 's#vendor/RakNet/#vendor/raknet/#g; s#vendor/RakNet#vendor/raknet#g'

          # Restore known case-sensitive compatibility headers.
          mkdir -p "$S/gui/samp_widgets" "$S/game"
          p="$(find "$C" -type f -iname 'playerTabList.h' -print -quit || true)"
          [ -n "$p" ] && cp -f "$p" "$S/gui/samp_widgets/playerTabList.h" || true
          r="$(find "$C" -type f -iname 'RGBA.h' -print -quit || true)"
          [ -n "$r" ] && cp -f "$r" "$S/game/RGBA.h" || true

          # Hard verification: there must be exactly one implementation copy
          # of the known RakNet translation units.
          echo '--- RakNet implementation files ---'
          find "$S" -type f \( -name '*.cpp' -o -name '*.cc' -o -name '*.cxx' \) \
            | grep -Ei '/vendor/.*/(BitStream|DS_ByteQueue|PluginInterface|PluginInterface2|RakPeer|RakClient|CheckSum|CommandParserInterface|NetworkTypes|RakNetCommandParser)\.(cpp|cc|cxx)$' \
            | sort
          if find "$S/vendor" -mindepth 2 -maxdepth 2 -type d -iname 'RakNet' -print -quit | grep -q .; then
            echo 'ERROR: duplicate RakNet directory still exists'; exit 1
          fi

      - name: Clean native build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PROJECT_DIR/app/.cxx" "$PROJECT_DIR/app/build"

      - name: Build Release APK
        id: build
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace clean 2>&1 | tee /tmp/gradle.log
          s=${PIPESTATUS[0]}
          if [ "$s" -eq 0 ]; then
            ./gradlew --no-daemon --stacktrace :app:assembleRelease 2>&1 | tee -a /tmp/gradle.log
            s=${PIPESTATUS[0]}
          fi
          echo "GRADLE_EXIT=$s" >> /tmp/gradle.log
          exit "$s"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DexinMobile-cmake-final-diagnostics
          path: /tmp/gradle.log
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DexinMobile-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
